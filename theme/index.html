<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>朔元 · 题材</title>
<meta name="description" content="A股当日活跃题材：朔元叙事归类（涨停池原料，非同花顺/东财概念）">
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" href="/a-share-board/favicon.ico?v=5" sizes="any"><link rel="icon" type="image/svg+xml" href="/a-share-board/favicon.svg?v=5"><link rel="icon" type="image/png" sizes="32x32" href="/a-share-board/favicon-32.png?v=5"><link rel="apple-touch-icon" sizes="180x180" href="/a-share-board/apple-touch-icon.png?v=5"><link rel="manifest" href="/a-share-board/manifest.webmanifest?v=5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="朔元"><meta name="application-name" content="朔元"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;--up:#1A1A1A;--down:#B71C1C;--flat:#888888;--bd:#E5E2DA;--bg:#F7F5F0;--fg:#333333;--mut:#666666;--acc:#1A3A6B;--ttl:#1A3A6B;--pn:#FFFFFF;--pn2:#FBF9F4;--grid:#E5E2DA;--dim:#888888;--mono:"IBM Plex Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 10px 28px}
header{background:var(--pn);border-bottom:1px solid var(--bd);padding:12px 12px 10px;margin:0 -10px 10px}
h1{font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1 .cnt{background:var(--acc);color:#fff;border-radius:12px;padding:1px 10px;font-size:14px;font-weight:600}
.meta{color:var(--mut);font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 12px}
.meta b{color:var(--fg);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{font:inherit;font-size:15px;height:40px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;background:var(--pn);color:var(--fg);min-width:0}
.datebar{margin-top:8px}.datebar label{font-size:13px;color:var(--mut)}
#datesel{flex:0 1 200px}
.note{font-size:12px;color:var(--mut);line-height:1.55;margin:8px 2px 10px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ctl input{flex:1;min-width:140px}
.ctl select{flex:0 1 140px}
.stat{font-size:12.5px;color:var(--mut);margin:0 2px 8px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.empty{padding:36px 12px;text-align:center;color:var(--mut);background:var(--pn);border:1px solid var(--bd);border-radius:12px}
.tlist{display:flex;flex-direction:column;gap:8px}
.tc{background:var(--pn);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.th{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.th:active{background:rgba(26,58,107,.06)}
.rk{flex:none;width:28px;height:28px;border-radius:8px;background:var(--pn2);color:var(--mut);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.rk.t3{background:rgba(26,58,107,.14);color:var(--acc)}
.tm{flex:1;min-width:0}
.tm .nm{font-size:16px;font-weight:700;color:var(--ttl);line-height:1.25}
.tm .bd{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--mut)}
.tm .bd b{color:var(--fg);font-weight:700}
.chev{flex:none;color:var(--mut);font-size:18px;line-height:28px;transition:transform .15s}
.tc.open .chev{transform:rotate(90deg)}
.tb{display:none;border-top:1px solid var(--bd);background:var(--pn2)}
.tc.open .tb{display:block}
.tb table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:0 10px;height:42px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;font-size:13.5px}
.tb th{font-size:12px;font-weight:600;color:var(--mut);background:var(--pn2);height:36px;text-align:right}
.tb th.l,.tb td.l{text-align:left}
.tb tr:last-child td{border-bottom:0}
.tb tr[data-c]{cursor:pointer}
.tb tr[data-c]:active{background:rgba(26,58,107,.06)}
.tb .nm b{display:block;font-size:14.5px;font-weight:600;color:var(--fg)}
.tb .nm small{color:var(--mut);font-size:11.5px}
.tb .rs{max-width:280px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--mut);text-align:left;white-space:nowrap}
.stk{display:inline-block;min-width:28px;border-radius:10px;padding:0 7px;background:rgba(183,28,28,.10);color:var(--up);font-weight:700;text-align:center;font-size:12.5px}
.stk.w{background:rgba(26,58,107,.10);color:var(--acc)}
.tv{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;line-height:18px;height:20px;padding:0 5px;border:1px solid var(--bd);border-radius:5px;color:var(--acc);background:rgba(26,58,107,.08);text-decoration:none;vertical-align:1px}
details.help{font-size:12.5px;color:var(--mut);margin-top:14px}
details.help summary{cursor:pointer;color:var(--acc)}
.kov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:max(8px,env(safe-area-inset-top,0px));box-sizing:border-box}
.kov[hidden]{display:none}
.ksheet{background:var(--pn);width:100%;max-height:94vh;max-height:calc(100dvh - max(8px,env(safe-area-inset-top,0px)) - 8px);overflow:auto;border-radius:16px 16px 0 0;padding:0 12px;box-shadow:0 -6px 30px rgba(0,0,0,.18);animation:up .18s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.khd{display:flex;align-items:flex-start;gap:8px;position:sticky;top:0;z-index:3;background:var(--pn);margin:0 -12px;padding:12px 12px 8px;border-radius:16px 16px 0 0}
.khd .t{flex:1;min-width:0}
.khd .t b{font-size:18px}.khd .t span{color:var(--mut);margin-left:6px;font-size:13px}
.kx{border:0;background:var(--grid);border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--mut);cursor:pointer;flex:none}
.kmeta{font-size:13px;color:var(--mut);margin:2px 0 8px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.kmeta .px{font-size:20px;font-weight:700}
.kbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kbtns a,.kbtns button{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);text-decoration:none;font:inherit;font-size:13.5px;cursor:pointer}
.kbtns a.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.kbtns .rg{margin-left:auto;display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.kbtns .rg button{border:0;border-radius:0;height:34px}
.kbtns .rg button.on{background:rgba(26,58,107,.12);color:var(--acc);font-weight:600}
.kinfo{font-size:12.5px;min-height:38px;color:var(--fg);background:var(--pn2);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;line-height:1.5}
.kinfo b{font-weight:600}
#kcv{display:block;width:100%;height:420px;touch-action:pan-y;margin-top:6px}
.knav{position:sticky;bottom:0;background:var(--pn);display:flex;align-items:center;gap:10px;margin:8px -12px 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);z-index:2}
.knav button{flex:1;height:48px;border-radius:12px;border:1px solid var(--bd);background:rgba(26,58,107,.08);color:var(--acc);font:inherit;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation}
.knav button:focus:not(:focus-visible){outline:none}
.knav button:disabled{color:#888888;background:var(--pn2);border-color:var(--bd);cursor:default}
.knav span{min-width:64px;text-align:center;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
tr.flash td{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:rgba(26,58,107,.28)}100%{}}
@media (max-width:520px){
  .tb .hid{display:none}
  .tb .rs{max-width:140px;display:table-cell}
  .tm .nm{font-size:15px}
  .tb th,.tb td{padding:0 8px;font-size:13px}
}
@media (min-width:760px){.kov{align-items:center;padding-top:0}.knav{margin:10px -18px 0;padding:10px 18px}.ksheet{width:860px;max-width:94vw;border-radius:16px;padding:0 18px;max-height:min(90vh,calc(100dvh - 24px))}.khd{margin:0 -18px;padding:16px 18px 10px}#kcv{height:540px}}
</style>
</head>
<body>
<style>.stab{background:#FFFFFF;border-top:2px solid #1A3A6B;border-bottom:1px solid #E5E2DA;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab .stab-g,.stab .stab-s{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab .stab-g a,.stab .stab-s a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#666666;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab .stab-g a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}.stab .stab-s{border-top:1px solid #E5E2DA;background:#FBF9F4}.stab .stab-s a{height:38px;line-height:38px;font-size:14px;font-weight:600;color:#666666}.stab .stab-s a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}@media (max-width:759px){.stab .stab-g a,.stab .stab-s a{flex:1;text-align:center;padding:0 2px;font-size:13px}.stab .stab-s a{font-size:12.5px;height:36px;line-height:36px}}@media (max-width:420px){.stab .stab-g,.stab .stab-s{gap:0}.stab .stab-g a{font-size:13px;padding:0 1px}.stab .stab-s a{font-size:12px;padding:0 1px}}@media (max-width:350px){.stab .stab-g a,.stab .stab-s a{font-size:11px}}</style><nav class="stab" aria-label="看板分类"><div class="stab-g" role="navigation" aria-label="大类"><a href="../market/">A股</a><a href="../us/">美股</a><a href="../" class="on">选股</a></div><div class="stab-s" role="navigation" aria-label="子看板"><a href="../">10日新高</a><a href="../ema-x/">上穿EMA</a><a href="../ema-up/">EMA上方</a><a href="../theme/" class="on" aria-current="page">题材</a></div></nav>
<div class="wrap">
<header>
  <h1>A股题材 <span class="cnt" id="cnt">—</span></h1>
  <div class="meta">
    <span>交易日 <b id="td">—</b></span>
    <span>涨停 <b id="nlu">—</b></span>
    <span>更新 <b id="run">—</b></span>
  </div>
  <div class="row datebar">
    <label for="datesel">日期</label>
    <select id="datesel"></select>
  </div>
</header>

<p class="note" id="srcnote">题材为朔元叙事归类（涨停池原料）；强度：涨停家数 → 最高连板 → 封单合计。点开题材看个股；再点个股看日K / 跳转 TradingView。</p>

<div class="ctl">
  <input id="q" type="search" placeholder="搜索题材 / 股票 / 代码 / 原因" autocomplete="off">
  <select id="sort">
    <option value="n">按家数</option>
    <option value="board">按最高连板</option>
    <option value="seal">按封单</option>
  </select>
</div>
<div class="stat" id="stat"></div>
<div id="list" class="tlist"></div>
<div id="empty" class="empty" hidden>暂无数据</div>

<details class="help">
  <summary>数据说明</summary>
  <p id="helptext" style="margin:8px 0 0;line-height:1.6"></p>
</details>
</div>
<div class="kov" id="kov" hidden><div class="ksheet" role="dialog" aria-modal="true">
 <div class="khd"><div class="t"><b id="kname"></b><span id="kcode"></span></div><button class="kx" id="kx" aria-label="关闭">✕</button></div>
 <div class="kmeta" id="kmeta"></div>
 <div class="kbtns"><a class="pri" id="ktv">TradingView</a><a id="ktvw" target="_blank" rel="noopener">TV网页版</a><a id="kths" target="_blank" rel="noopener">同花顺</a>
  <span class="rg" id="krg"><button data-n="60">3个月</button><button data-n="120">6个月</button><button data-n="240" class="on">12个月</button></span></div>
 <div class="kinfo" id="kinfo">加载中…</div>
 <canvas id="kcv"></canvas>
 <div class="knav"><button id="kprev" aria-label="上一只">‹ 上一只</button><span id="kpos"></span><button id="knext" aria-label="下一只">下一只 ›</button></div>
</div></div>
<script>
(function(){
"use strict";
var D=null, OPEN={}, DV={}, KV="";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function cls(v){return v==null||v===""||isNaN(v)?"":Number(v)>0?"up":Number(v)<0?"down":"flat"}
function sg(v,d){if(v==null||v===""||isNaN(v))return "—";var n=Number(v),s=(n>0?"+":"")+n.toFixed(d==null?2:d);return '<span class="'+cls(n)+'">'+s+"%</span>"}
function hms(iso){if(!iso)return "—";var m=String(iso).match(/T(\d{2}:\d{2})/);return m?m[1]:iso}
function pd(t){return t.slice(0,4)+"-"+t.slice(4,6)+"-"+t.slice(6)}
function get(u,fresh){return fetch(fresh?u+(u.indexOf("?")<0?"?":"&")+"t="+Date.now():u,{cache:fresh?"no-store":"no-cache"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function vq(u,v){return v?u+(u.indexOf("?")<0?"?":"&")+"v="+v:u}
function url(c){return "https://m.10jqka.com.cn/stockpage/hs_"+c+"/"}
function tvsym(c){c=String(c);if(/^(60|68)/.test(c))return "SSE:"+c;if(/^(00|30)/.test(c))return "SZSE:"+c;return ""}
var FINE=window.matchMedia&&matchMedia("(hover:hover) and (pointer:fine)").matches;
function tvapp(t){return "tradingview://chart?symbol="+t}
function tvweb(t){return "https://www.tradingview.com/chart/?symbol="+encodeURIComponent(t)}
function tvsy(t){return "https://www.tradingview.com/symbols/"+t.replace(":","-")+"/"}
function toast(m){var d=document.getElementById("toast");if(!d){d=document.createElement("div");d.id="toast";d.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,20,20,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9999;max-width:88%;text-align:center;transition:opacity .3s";document.body.appendChild(d)}d.textContent=m;d.style.opacity=1;clearTimeout(d._t);d._t=setTimeout(function(){d.style.opacity=0},2600)}
function copyTxt(t){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return}}catch(e){}var a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:-99px;opacity:0";document.body.appendChild(a);a.select();a.setSelectionRange(0,99);try{document.execCommand("copy")}catch(e){}document.body.removeChild(a)}
function tvGo(t){if(!t)return;if(FINE){window.open(tvweb(t),"_blank","noopener");return}var c=t.split(":")[1]||t;copyTxt(c);toast("已复制 "+c+"，在 TradingView 里点搜索粘贴即可");setTimeout(function(){location.href=tvapp(t)},700)}

function flatStocks(){
  var out=[],seen={};
  (D&&D.themes||[]).forEach(function(t){
    (t.stocks||[]).forEach(function(s){
      if(!s||!s.c||seen[s.c])return;seen[s.c]=1;out.push(s);
    });
  });
  return out;
}
function findStock(c){
  var hit=null;
  (D&&D.themes||[]).forEach(function(t){
    (t.stocks||[]).forEach(function(s){if(s.c===c)hit=s});
  });
  return hit;
}
function themeStockList(themeName){
  var t=(D&&D.themes||[]).filter(function(x){return x.name===themeName})[0];
  return t? (t.stocks||[]).map(function(s){return s.c}) : [];
}

function filtered(){
  var q=($("#q").value||"").trim().toLowerCase();
  var key=$("#sort").value;
  var arr=(D&&D.themes||[]).slice();
  if(q){
    arr=arr.filter(function(t){
      if((t.name||"").toLowerCase().indexOf(q)>=0) return true;
      return (t.stocks||[]).some(function(s){
        return (s.n||"").toLowerCase().indexOf(q)>=0
          || (s.c||"").indexOf(q)>=0
          || (s.reason||"").toLowerCase().indexOf(q)>=0;
      });
    });
  }
  arr.sort(function(a,b){
    var alu=a.n_lu!=null?a.n_lu:a.n, blu=b.n_lu!=null?b.n_lu:b.n;
    if(key==="board") return (b.max_board||0)-(a.max_board||0) || blu-alu;
    if(key==="seal") return (b.seal||0)-(a.seal||0) || blu-alu;
    return blu-alu || (b.max_board||0)-(a.max_board||0) || (b.seal||0)-(a.seal||0) || (b.n||0)-(a.n||0);
  });
  return arr;
}

function stockRows(stocks, limit){
  var rows=(stocks||[]).slice(0, limit||80);
  return rows.map(function(s){
    var watch=!!s.watch || s.board_t==="观察";
    var board = s.board_t || (s.board? (s.board+"板"):"");
    var t=tvsym(s.c);
    return '<tr data-c="'+esc(s.c)+'">'+
      '<td class="l nm"><b>'+esc(s.n)+'</b><small>'+esc(s.c)+'</small>'+(t?'<a class="tv" href="'+tvsy(t)+'" data-sym="'+t+'" title="TradingView '+t+'">TV</a>':'')+'</td>'+
      '<td>'+(s.chg==null?"—":sg(s.chg,2))+'</td>'+
      '<td>'+(board?'<span class="stk'+(watch?" w":"")+'">'+esc(board)+'</span>':"—")+'</td>'+
      '<td>'+(watch?"—":(s.seal!=null?s.seal:"—"))+'</td>'+
      '<td class="hid">'+(s.t||"—")+'</td>'+
      '<td class="l rs" title="'+esc(s.reason||'')+'">'+esc(s.reason||"—")+'</td>'+
      '</tr>';
  }).join("");
}

function render(){
  if(!D){ $("#empty").hidden=false; $("#list").innerHTML=""; return; }
  $("#td").textContent=D.date||"—";
  $("#nlu").textContent=D.n_limit_up!=null?D.n_limit_up:"—";
  $("#run").textContent=hms(D.run_at);
  var arr=filtered();
  $("#cnt").textContent=arr.length;
  $("#stat").textContent="显示 "+arr.length+" 个叙事题材 · 全日涨停 "+(D.n_limit_up||0)+" 家 · 点个股看K线";
  $("#srcnote").textContent="题材为朔元叙事归类（非同花顺标签/东财概念）；强度：涨停家数 → 最高连板 → 封单合计。「观察」为盯盘种子股。点开题材，再点个股看日K / TradingView。";
  $("#helptext").textContent = D.note || "";

  if(!arr.length){ $("#empty").hidden=false; $("#empty").textContent="无匹配题材"; $("#list").innerHTML=""; return; }
  $("#empty").hidden=true;
  var html="";
  var head='<th class="l">名称</th><th>涨跌幅</th><th>连板</th><th>封单(亿)</th><th class="hid">时间</th><th class="l">原因</th>';
  arr.forEach(function(t,i){
    var id = "zt:"+(t.name||"");
    var open = !!OPEN[id];
    var nlu = t.n_lu!=null?t.n_lu:t.n;
    var nw = t.n_watch||0;
    var badges = '<span>涨停 <b>'+nlu+'</b></span>'+(nw?'<span>观察 <b>'+nw+'</b></span>':'')+'<span>最高 <b>'+(t.max_board||0)+'</b> 连板</span><span>封单 <b>'+(t.seal||0)+'</b> 亿</span>';
    html += '<div class="tc'+(open?" open":"")+'" data-id="'+esc(id)+'" data-theme="'+esc(t.name||'')+'">'+
      '<div class="th" role="button" tabindex="0" aria-expanded="'+(open?"true":"false")+'">'+
        '<div class="rk'+(i<3?" t3":"")+'">'+(i+1)+'</div>'+
        '<div class="tm"><div class="nm">'+esc(t.name)+'</div><div class="bd">'+badges+'</div></div>'+
        '<div class="chev">›</div>'+
      '</div>'+
      '<div class="tb"><table><thead><tr>'+head+'</tr></thead><tbody>'+stockRows(t.stocks)+'</tbody></table></div>'+
    '</div>';
  });
  $("#list").innerHTML=html;
}

function bind(){
  $("#list").addEventListener("click",function(e){
    var tv=e.target.closest("a.tv");
    if(tv){ e.preventDefault(); e.stopPropagation(); tvGo(tv.getAttribute("data-sym")); return; }
    var tr=e.target.closest("tr[data-c]");
    if(tr){
      var tc=tr.closest(".tc");
      var theme=tc?tc.getAttribute("data-theme"):"";
      openK(tr.getAttribute("data-c"), themeStockList(theme));
      return;
    }
    var th=e.target.closest(".th"); if(!th) return;
    var tc=th.parentElement; var id=tc.getAttribute("data-id");
    OPEN[id]=!OPEN[id]; tc.classList.toggle("open",!!OPEN[id]);
    th.setAttribute("aria-expanded", OPEN[id]?"true":"false");
  });
  $("#q").addEventListener("input",render);
  $("#sort").addEventListener("change",render);
  $("#datesel").addEventListener("change",function(){ load($("#datesel").value); });
}

function dates(list){
  var sel=$("#datesel"); sel.innerHTML="";
  (list||[]).forEach(function(x){
    DV[x.d]=x.v||"";
    if(!KV && x.v) KV=x.v;
    var o=document.createElement("option");
    o.value=x.d;
    o.textContent=x.d.slice(0,4)+"-"+x.d.slice(4,6)+"-"+x.d.slice(6)+(x.lu!=null?(" · 涨停"+x.lu):"");
    sel.appendChild(o);
  });
}

function load(tag){
  var u = tag ? ("data/"+tag+".json") : "data/latest.json";
  var v = tag && DV[tag] ? ("?v="+DV[tag]) : "";
  return get(u+v, !tag).then(function(d){
    D=d; OPEN={};
    if(d&&d.run_at) KV=String(d.run_at).replace(/\D/g,"").slice(0,14)||KV;
    if(tag) $("#datesel").value=tag;
    else if(d.tag) $("#datesel").value=d.tag;
    render();
    document.title="朔元 · 题材 "+(d.date||"");
  }).catch(function(e){
    D=null; render();
    $("#empty").hidden=false; $("#empty").textContent="加载失败："+e.message;
  });
}
