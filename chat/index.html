<style>
:root{color-scheme:light;--bd:#E5E2DA;--bg:#F7F5F0;--fg:#333333;--mut:#666666;--acc:#1A3A6B;--ttl:#1A3A6B;--pn:#FFFFFF;--pn2:#FBF9F4;--grid:#E5E2DA;--dim:#888888;--mine:#1A3A6B;--mono:"IBM Plex Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%}

body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}

.brand{display:flex;align-items:flex-start;gap:12px;min-width:0}
.mark{flex:none;background:var(--acc);color:#fff;font-size:13px;font-weight:700;letter-spacing:.18em;padding:7px 9px;line-height:1}
.brand h1{margin:0;font-size:20px;font-weight:650;color:var(--ttl);letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;flex:none}
.who-t{text-align:right;white-space:nowrap}
.who-t b{display:block;font-size:13.5px;font-weight:650}
.who-t span{display:block;font-size:12px;color:var(--mut)}
.desk{flex:1;display:flex;min-height:0;border:1px solid var(--bd);border-top:0;background:var(--pn);margin:0 -16px}
.side{width:240px;flex:none;border-right:1px solid var(--bd);background:var(--pn2);display:flex;flex-direction:column;min-height:0}

.ch{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--grid);background:transparent;padding:12px 16px;cursor:pointer;color:inherit}
.ch:hover{background:#fff}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.room{padding:14px 18px 12px;border-bottom:1px solid var(--bd);background:#fff}

.room span{display:block;margin-top:2px;font-size:12.5px;color:var(--mut)}
.log{flex:1;overflow:auto;padding:16px 18px 8px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.day{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--mut);font-size:12px}
.day:before,.day:after{content:"";flex:1;height:1px;background:var(--grid)}
.row{display:flex;margin:0 0 12px;gap:10px}
.row.mine{flex-direction:row-reverse}
.bubble{max-width:min(520px,78%);background:#fff;border:1px solid var(--bd);padding:8px 12px 9px}
.row.mine .bubble{background:var(--acc);color:#fff;border-color:var(--acc)}

.row.mine .bubble .from{color:rgba(255,255,255,.85)}
.bubble .tx{font-size:14px;white-space:pre-wrap;word-break:break-word}

.row.mine .bubble .tm{color:rgba(255,255,255,.7)}

.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:1px solid var(--bd);padding:10px 12px;font:inherit}
.composer textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}

.row.typing .bubble{background:var(--pn2)}
.row.typing .tx{color:var(--mut);font-size:13px}
[hidden]{display:none !important}
@media (max-width:759px){
  .wrap{padding:0 0 0}
  .top{margin:0;padding:14px 12px 12px}
  .desk{flex-direction:column;margin:0;border-left:0;border-right:0;flex:1}

  .who-t span{display:none}
  .log{padding:12px}

@media (min-width:760px){
  body{font-size:14.5px}
  .top{margin:0;border-top:1px solid var(--bd)}
  .desk{margin:0;border:1px solid var(--bd);border-top:0}
}
</style>
</head>

    msg('C-20261126-47', 'general', '李乔峰', '2026-11-26 10:12:00', '筛选我帮李宇涛看一眼，先不改参数'),
    msg('C-20261126-48', 'general', '杨典', '2026-11-26 15:12:00', '纪要按郑艳萍那句，写修复就行'),
    msg('C-20261126-49', 'admin', '黄盛', '2026-11-26 08:50:00', '病假那两张我批了。盘中有事找郑艳萍。'),
    msg('C-20261126-50', 'general', '杨典', '2026-11-26 18:40:00', '宏观日历我贴文档柜了，今晚复盘用，别当新闻转发。')
  ];
  var ZHENG = '郑艳萍';
  var LIYU = '李宇涛';
  var NIE = '聂晗';
  var QIAO = '李乔峰';
  var YANG = '杨典';
  var BANK = {
    zheng: ['收到', '我先看', '行', '这事我记着', '先看下午', '先冻着', '别急', '记下了', '盘中我盯', '先别动'],
    zhengLeave: ['记下了', '开盘覆盖我盯', '排班先别动', '行，盘中我这边接', '这事我记着', '病假那条我看到了'],
    zhengTape: ['先看下午', '别当反转', '先当修复', '今晚复盘', '这事我先记着', '别急着下结论', '覆盖我来'],
    liyu: ['我先看', '行', '这块我跟一下', '等会回你', '今晚复盘', '我丢文档柜'],
    liyuBoard: ['看板我先看一眼', '筛选先别改', '这块我等会回', '工具页我收一下', '过滤别当天改', '看板先冻着', '回测我晚上跑'],
    liyuTape: ['我先看筛选', '先不当反转', '今晚把复盘写了', '仓位这块我记着', '先看下午', '观点先放着'],
    nie: ['我晚点看', '看板别大改', '文案短一点就行', '工具先别动', '收到', '行'],
    qiao: ['盘面我看一眼', '行', '仓位先不动', '先这样', '收到', '开盘我盯着'],
    yang: ['收到', '行', '我先看', '记下了', '今晚复盘', '观点先放着'],
    ack: ['收到', '行', '嗯', '记下了'],
    add: ['行', '收到', '先这样', '我跟上', '记下了', '先看下午', '同意', '先冻着', '今晚复盘']
  };
  var state = { group: 'general', extra: [], typing: null, pendingToken: 0, pendingTimers: [], pickN: {} };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function loadExtra() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var data = JSON.parse(raw);
      var rows = data && data.created ? data.created : [];
      return rows.filter(function (m) {
        return m && m.id && m.group && m.from && m.at && m.text;
      });
    } catch (e) {
      return [];
    }
  }
  function saveExtra() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ created: state.extra }));
    } catch (e) {}
  }
  function allMsgs() {
    return SEED.concat(state.extra).slice().sort(function (a, b) {
      if (a.at === b.at) return a.id < b.id ? -1 : 1;
      return a.at < b.at ? -1 : 1;
    });
  }
  function lastOf(gid) {
    var rows = allMsgs().filter(function (m) { return m.group === gid; });
    return rows.length ? rows[rows.length - 1] : null;
  }
  function dayLabel(at) {
    var p = at.slice(0, 10).split('-');
    return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
  }
  function hm(at) { return at.slice(11, 16); }
  function renderSide() {
    $('side').innerHTML = '<h2>讨论组</h2>' + GROUPS.map(function (g) {
      var last = lastOf(g.id);
      return '<button type="button" class="ch' + (g.id === state.group ? ' on' : '') + '" data-g="' + g.id + '">' +
        '<span class="n">' + esc(g.name) + '</span>' +
        '<span class="p">' + esc(last ? last.from + '：' + last.text : '暂无消息') + '</span></button>';
    }).join('');
  }
  function renderLog() {
    var g = GROUPS.filter(function (x) { return x.id === state.group; })[0];
    $('roomName').textContent = g.name;
    $('roomHint').textContent = g.hint;
    var rows = allMsgs().filter(function (m) { return m.group === state.group; });
    var html = '';
    var lastDay = '';
    rows.forEach(function (m) {
      var d = dayLabel(m.at);
      if (d !== lastDay) {
        html += '<div class="day">' + esc(d) + '</div>';
        lastDay = d;
      }
      var mine = m.from === ME;
      html += '<div class="row' + (mine ? ' mine' : '') + '"><div class="bubble">' +
        '<div class="from">' + esc(m.from) + '</div>' +
        '<div class="tx">' + esc(m.text) + '</div>' +
        '<div class="tm">' + esc(hm(m.at)) + '</div></div></div>';
    });
    if (state.typing && state.typing.group === state.group) {
      html += '<div class="row typing"><div class="bubble">' +
        '<div class="from">' + esc(state.typing.name) + '</div>' +
        '<div class="tx">' + esc(state.typing.name) + ' 正在输入…</div></div></div>';
    }
    $('log').innerHTML = html;
    $('log').scrollTop = $('log').scrollHeight;
  }
  function refresh() {
    renderSide();
    renderLog();
  }
  function todayYmd() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }
  function nowText() {
    var t = new Intl.DateTimeFormat('en-GB', {
      timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).format(new Date());
    return todayYmd() + ' ' + t;
  }
  function nextId(prefix) {
    return (prefix || 'C-L-') + Date.now() + '-' + Math.floor(Math.random() * 1000);
  }
  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function hasAny(text, words) {
    return words.some(function (w) { return text.indexOf(w) !== -1; });
  }
  function pick(arr, key) {
    var n = state.pickN[key] || 0;
    state.pickN[key] = n + 1;
    return arr[(hashStr(key) + n) % arr.length];
  }
  function cancelPending() {
    state.pendingTimers.forEach(function (id) { clearTimeout(id); });
    state.pendingTimers = [];
    state.pendingToken += 1;
    state.typing = null;
  }
  function later(ms, fn) {
    var id = setTimeout(fn, ms);
    state.pendingTimers.push(id);
    return id;
  }
  function insertReply(group, name, text) {
    if (!name || name === ME || name === '黄盛') return;
    state.extra.push(msg(nextId('C-R-'), group, name, nowText(), text));
    saveExtra();
    refresh();
  }
  function lineFor(name, group, text, flags, which) {
    var key = name + '|' + group + '|' + which + '|' + text;
    if (which === 1) return pick(BANK.add, key);
    if (flags.ack) return pick(BANK.ack, key);
    if (name === ZHENG) {
      if (flags.leave) return pick(BANK.zhengLeave, key);
      if (flags.tape) return pick(BANK.zhengTape, key);
      return pick(BANK.zheng, key);
    }
    if (name === LIYU) {
      if (flags.ship || group === 'board') return pick(BANK.liyuBoard, key);
      if (flags.tape) return pick(BANK.liyuTape, key);
      return pick(BANK.liyu, key);
    }
    if (name === NIE) return pick(BANK.nie, key);
    if (name === QIAO) return pick(BANK.qiao, key);
    return pick(BANK.yang, key);
  }
  function planReplies(group, text) {
    var flags = {
      leave: hasAny(text, ['请假', '调休', '病假', '值班']),
      ship: hasAny(text, ['发版', '合并', '空状态', '看板', 'EMA', 'ema', '回测', '过滤']),
      tape: hasAny(text, ['盘面', '仓位', '开盘', '收盘', '复盘', '美股', 'A股', '财报', '宏观', '风险']),
      ack: /^(收到|同意|好的|好|行|嗯|可以)([。.!！]?)$/.test(text)
    };
    var first;
    var second = null;
    if (flags.leave) first = ZHENG;
    else if (flags.ship) first = LIYU;
    else if (flags.tape) {
      var t = hashStr(text) % 10;
      first = t < 5 ? LIYU : (t < 8 ? ZHENG : QIAO);
    } else if (group === 'admin') first = ZHENG;
    else if (group === 'board') first = (hashStr(text) % 2 === 0) ? LIYU : NIE;
    else {
      var r = hashStr(text) % 20;
      if (r < 8) first = ZHENG;
      else if (r < 14) first = LIYU;
      else if (r < 17) first = NIE;
      else if (r < 19) first = QIAO;
      else first = YANG;
    }
    var p2 = group === 'admin' ? 0.22 : (flags.ack ? 0.15 : 0.5);
    if (Math.random() < p2) {
      if (flags.leave) second = LIYU;
      else if (flags.ship) second = (hashStr(text + 'x') % 2) ? ZHENG : NIE;
      else if (flags.tape) second = first === LIYU ? ZHENG : (first === ZHENG ? LIYU : YANG);
      else if (group === 'admin') second = LIYU;
      else if (group === 'board') second = first === LIYU ? NIE : LIYU;
      else {
        var extras = [ZHENG, LIYU, QIAO, YANG].filter(function (n) { return n !== first; });
        second = extras[hashStr(text + '2') % extras.length];
      }
    }
    if (second === first) second = null;
    if (first === ME || first === '黄盛') first = ZHENG;
    if (second === ME || second === '黄盛') second = null;
    var out = [{ name: first, text: lineFor(first, group, text, flags, 0) }];
    if (second) out.push({ name: second, text: lineFor(second, group, text, flags, 1) });
    return out;
  }
  function scheduleReplies(group, text) {
    cancelPending();
    var token = state.pendingToken;
    var plan = planReplies(group, text);
    if (!plan.length) return;
    state.typing = { group: group, name: plan[0].name };
    refresh();
    later(1200 + Math.floor(Math.random() * 2300), function () {
      if (token !== state.pendingToken) return;
      state.typing = null;
      insertReply(group, plan[0].name, plan[0].text);
      if (!plan[1]) return;
      state.typing = { group: group, name: plan[1].name };
      refresh();
      later(1000 + Math.floor(Math.random() * 2000), function () {
        if (token !== state.pendingToken) return;
        state.typing = null;
        insertReply(group, plan[1].name, plan[1].text);
      });
    });
  }
  $('side').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-g]');
    if (!t) return;
    state.group = t.getAttribute('data-g');
    refresh();
  });
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = $('input').value.trim();
    if (!text) return;
    var gid = state.group;
    state.extra.push(msg(nextId('C-L-'), gid, ME, nowText(), text));
    saveExtra();
    $('input').value = '';
    refresh();
    $('input').focus();
    scheduleReplies(gid, text);
  });
  $('input').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      $('form').requestSubmit();
    }
  });
  $('whoName').textContent = ME;
  state.extra = loadExtra();
  refresh();
})();
</script>
</body>
</html>
