  o+='<br>距强平 '+(r.dpct==null?'<b>暂无数据</b>':'<b class="'+(r.dpct<10?"dn":"up")+'">'+r.dpct.toFixed(2)+'%</b> · 价差 <b>'+fp(r.dpx,tk)+'</b>（强平价在标记价'+(r.lg?"下方":"上方")+'）')+'</div>';
  o+='<div class="grid">'+
   '<div><span>开仓价</span><em>'+fp(p.entry,tk)+'</em></div>'+
   '<div><span>标记价</span><em>'+fp(r.mark,tk)+'<span class="live '+(r.live?"on":"off")+'">'+(r.live?"实时":"快照")+'</span></em></div>'+
   '<div><span>强平价</span><em>'+(r.liq?fp(r.liq,tk):"—")+'</em></div>'+
   '<div><span>浮盈</span><em class="'+cls(r.upnl)+'">'+fu(r.upnl,1)+' U</em></div>'+
   '<div><span>名义价值</span><em>'+u0(r.notional)+' U</em></div>'+
   '<div><span>保证金</span><em>'+u0(r.im)+' U</em></div></div>';
  o+='<div class="ft">'+(p.mt==="isolated"?"逐仓":"全仓")+' · 强平价为 '+(D.st&&D.st.sync?bj(D.st.sync):bj(D.t))+' 同步</div></div>';
  h.push(o)});
 $("#list").innerHTML=h.join("");
 var over=B.used!=null&&B.used>CAP;
 $("#warn").innerHTML=over?'<div class="warn">已用 '+pct1(B.used)+'，超过 60% 上限。按规则要留至少 40% 空仓，先别加。</div>':"";
 $("#sum").innerHTML='<div class="sum">'+
  '<div class="bx'+(over?" bad":"")+'"><div class="l">已用仓位</div><div class="v">'+(B.used==null?"暂无数据":pct1(B.used))+'</div><div class="s">'+(B.slots==null?"— / "+SLOTS+" 档":B.slots.toFixed(1)+" / "+SLOTS+" 档")+' · '+u0(B.im)+' U</div></div>'+
  '<div class="bx'+(over?" bad":"")+'"><div class="l">剩余仓位</div><div class="v">'+(B.left==null?"暂无数据":pct1(B.left))+'</div><div class="s">上限 60%，保留 40%</div></div>'+
  '<div class="bx"><div class="l">账户杠杆</div><div class="v">'+(B.lev==null?"暂无数据":B.lev.toFixed(2)+"x")+'</div><div class="s">名义 '+u0(B.no)+' U</div></div></div>';
 $("#acct").innerHTML='<div class="acct">'+
  '<div><span>钱包余额</span><em>'+(B.wb==null?"暂无数据":u0(B.wb)+" U")+'</em></div>'+
  '<div><span>权益</span><em>'+(B.eq==null?"暂无数据":u0(B.eq)+" U")+'</em></div>'+
  '<div><span>未实现盈亏</span><em class="'+cls(B.up)+'">'+(B.acct||B.rows.length?fu(B.up,1)+" U":"暂无数据")+'</em></div>'+
  '<div><span>可用余额</span><em>'+(B.avail==null?"暂无数据":u0(B.avail)+" U")+'</em></div></div>';
 status();S.dirty=false}
function status(){if(!K)return;var now=Date.now(),s;
 if(!D){s='<span class="dot '+(S.err?"off":"busy")+'"></span>'+(S.err?'<span class="w">'+esc(S.err)+'</span>':'暂无数据。等待电脑发来加密快照…（Mac 离线超过 12 小时就没有缓存）');$("#st").innerHTML=s;return}
 var macAge=now-D.t,macLive=(S.answered&&now-S.answered<PING_MS+60000)||macAge<180000;
 var dc=macLive?"g":"r";
 s='<span class="dot '+dc+(S.busy?" busy":"")+'"></span>快照 <b>'+bj(D.t,1)+'</b> 北京时间（'+ago(D.t)+'）'+(macLive?' <span class="ok">电脑在线</span>':' <span class="w">电脑可能离线，显示上次快照</span>');
 if(!D.acct)s+='<br><span class="w">这份快照还没有账户权益，仓位占比先显示「暂无数据」。等电脑发来新快照后会补上。</span>';
 else if(D.acct.at)s+='<br>账户数字同步于 <b>'+bj(D.acct.at)+'</b>，权益和可用按当前标记价在手机上更新';
 if(S.busy)s+='<br>正在向电脑要最新数据…';else if(S.err)s+='<br><span class="w">'+esc(S.err)+'</span>';
 $("#st").innerHTML=s}

function start(){$("#lock").hidden=true;$("#main").hidden=false;$("#rf").hidden=false;status();
 loadLatest().then(function(){status();sse();refresh(false)})}
function showLock(err){$("#main").hidden=true;$("#lock").hidden=false;$("#perr").textContent=err||"";setTimeout(function(){$("#pw").focus()},50)}
$("#pf").addEventListener("submit",function(e){e.preventDefault();var v=$("#pw").value;if(!norm(v))return;$("#perr").textContent="验证中…";$("#pfb").disabled=true;
 derive(v).then(function(m){return setup(m).then(function(){if($("#rem").checked)try{localStorage.setItem(LSK,hex(m))}catch(x){}})}).then(function(){$("#pfb").disabled=false;$("#pw").value="";start()},
  function(err){$("#pfb").disabled=false;$("#perr").textContent=err&&err.message==="BADPW"?"密码不对":"解锁失败："+(err&&err.message||err)})});
$("#logout").addEventListener("click",function(e){e.preventDefault();try{localStorage.removeItem(LSK)}catch(x){}location.reload()});
$("#rf").addEventListener("click",function(){refresh(true)});
["touchstart","pointerdown","keydown","scroll"].forEach(function(ev){window.addEventListener(ev,function(){S.act=Date.now()},{passive:true})});
setInterval(function(){if(S.dirty&&!document.hidden)render()},1000);
setInterval(function(){if(!K||document.hidden)return;render();var now=Date.now();
 if(now-S.act<IDLE_MS&&now-S.lastMsg>PING_MS&&now-S.lastPing>PING_MS&&!S.busy)post("ping");
 if(!S.ws&&S.wsSyms)ws()},30000);
document.addEventListener("visibilitychange",function(){if(document.hidden||!K)return;S.act=Date.now();if(!S.ws)ws();if(!S.sseOk)sse();if(Date.now()-S.lastPing>20000)refresh(false)});
if(!window.crypto||!crypto.subtle){$("#lock").hidden=false;$("#perr").textContent="这个浏览器不支持加密解锁（需要 HTTPS 和较新的浏览器）";return}
var mk=null;try{mk=localStorage.getItem(LSK)}catch(e){}
if(mk&&/^[0-9a-f]{64}$/.test(mk))setup(unhex(mk)).then(start,function(){try{localStorage.removeItem(LSK)}catch(x){}showLock("密码已更换，请重新输入")});else showLock("");
})();
