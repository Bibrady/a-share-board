<style>
:root{--bg:#F7F5F0;--tx:#333;--ink:#1A1A1A;--acc:#1A3A6B;--grid:#E5E2DA;--mute:#888;
--mono:"IBM Plex Mono","SF Mono",SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
h1{margin:0 0 4px;font-size:20px;font-weight:700;color:var(--ink)}
.sub{margin:0 0 14px;font-size:13px;color:var(--mute)}
.card{background:#fff;border:1px solid var(--grid);border-radius:5px;padding:14px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;color:var(--acc);margin:0 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:120px}
input{width:100%;font-family:var(--mono);font-size:20px;padding:10px 12px;border:1px solid var(--grid);border-radius:4px;background:#FBF9F4;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--acc);background:#fff}
.out{display:grid;grid-template-columns:1fr;gap:10px}
.bx{padding:12px 14px;border:1px solid var(--grid);border-radius:4px;background:#FBF9F4}
.bx .l{font-size:12px;color:var(--mute);font-weight:600;margin:0 0 4px}
.bx .v{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--acc);line-height:1.2}
.bx .s{font-size:12px;color:var(--mute);margin-top:4px}
.bx.pri .v{font-size:32px}
.note{font-size:12px;color:var(--mute);margin:8px 0 0}
@media (min-width:480px){.out{grid-template-columns:1fr 1fr}.bx.pri{grid-column:1/-1}}
</style>

<style>.stab{background:#FFFFFF;border-top:2px solid #1A3A6B;border-bottom:1px solid #E5E2DA;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab .stab-g,.stab .stab-s{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab .stab-g a,.stab .stab-s a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#666666;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab .stab-g a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}.stab .stab-s{border-top:1px solid #E5E2DA;background:#FBF9F4}.stab .stab-s a{height:38px;line-height:38px;font-size:14px;font-weight:600;color:#666666}.stab .stab-s a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}@media (max-width:759px){.stab .stab-g a,.stab .stab-s a{flex:1;text-align:center;padding:0 2px;font-size:13px}.stab .stab-s a{font-size:12.5px;height:36px;line-height:36px}}@media (max-width:420px){.stab .stab-g,.stab .stab-s{gap:0}.stab .stab-g a{font-size:13px;padding:0 1px}.stab .stab-s a{font-size:12px;padding:0 1px}}@media (max-width:350px){.stab .stab-g a,.stab .stab-s a{font-size:11px}}</style><nav class="stab" aria-label="看板分类"><div class="stab-g" role="navigation" aria-label="大类"><a href="../market/">A股</a><a href="../us/">美股</a><a href="../">选股</a><a href="../pos/" class="on">仓位管理</a><a href="../fitness/">生活</a></div><div class="stab-s" role="navigation" aria-label="子看板"><a href="../pos/">仓位</a><a href="../be/">持仓保本</a><a href="../compound/">复利计算</a><a href="../pyramid/">倒金字塔</a><a href="../sizing/" class="on" aria-current="page">仓位计算</a></div></nav>
<div class="wrap">
<h1>仓位计算</h1>
<p class="sub">输入账户总金额、计划占用仓位百分比和杠杆，算出要下的保证金（及名义仓位、账户有效杠杆）。</p>
<div class="card"><div class="row">
<div style="flex:1.4"><label for="eq">总金额（U）</label><input id="eq" type="number" inputmode="decimal" min="0" step="any" placeholder="例如 5500"></div>
<div><label for="pct">仓位（%）</label><input id="pct" type="number" inputmode="decimal" min="0" max="100" step="any" value="75"></div>
<div><label for="lv">杠杆（倍）</label><input id="lv" type="number" inputmode="decimal" min="1" step="any" value="5"></div>
</div></div>
<div class="card">
<div class="out">
<div class="bx pri"><div class="l">保证金</div><div class="v" id="mg">—</div><div class="s">总金额 × 仓位%</div></div>
<div class="bx"><div class="l">名义仓位</div><div class="v" id="no">—</div><div class="s">保证金 × 杠杆</div></div>
<div class="bx"><div class="l">账户有效杠杆</div><div class="v" id="eff">—</div><div class="s">仓位% × 杠杆</div></div>
</div>
<p class="note">这里的「仓位%」指占用账户权益的保证金比例（例如 75% 仓位 + 5 倍杠杆 ≈ 账户 3.75 倍有效杠杆）。输入只记在这台设备上。</p>
</div>
</div>
<script>
(function(){
var K='sizing_calc_v1';
var eq=document.getElementById('eq'),pct=document.getElementById('pct'),lv=document.getElementById('lv');
var mg=document.getElementById('mg'),no=document.getElementById('no'),eff=document.getElementById('eff');
function f(x){return isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function fx(x){return isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'×':'—'}
function calc(){
 var E=parseFloat(eq.value),P=parseFloat(pct.value),L=parseFloat(lv.value);
 if(!(L>0))L=5;
 var ok=E>0&&P>=0;
 var M=ok?E*(P/100):NaN;
 mg.textContent=ok?f(M)+' U':'—';
 no.textContent=ok?f(M*L)+' U':'—';
 eff.textContent=ok?fx(P/100*L):'—';
 try{localStorage.setItem(K,JSON.stringify({eq:eq.value,pct:pct.value,lv:lv.value}))}catch(e){}
}
try{var s=JSON.parse(localStorage.getItem(K)||'null');if(s){if(s.eq!=null)eq.value=s.eq;if(s.pct!=null)pct.value=s.pct;if(s.lv)lv.value=s.lv}}catch(e){}
eq.addEventListener('input',calc);pct.addEventListener('input',calc);lv.addEventListener('input',calc);calc();
})();
</script>
