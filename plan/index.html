<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10倍计划 · 自动进度</title>
<meta name="description" content="10倍计划自动进度（只显示倍数与百分比）">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="/a-share-board/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/a-share-board/favicon-32.png"><link rel="apple-touch-icon" href="/a-share-board/apple-touch-icon.png"><link rel="manifest" href="/a-share-board/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="A股看板"><meta name="application-name" content="A股看板"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--up:#e0302b;--down:#0a9d4a;--flat:#888;--bd:#e8e8ec;--bg:#f5f6f8;--fg:#1d1d1f;--mut:#8a8f98;--acc:#2f6fed;--warnbg:#fff7e0;--warnfg:#8a5a00}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 10px calc(24px + env(safe-area-inset-bottom))}
header{background:#fff;border-bottom:1px solid var(--bd);padding:12px 12px 10px;margin:0 -10px 10px}
h1{font-size:18px;margin:0 0 6px}
.meta{color:var(--mut);font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 12px}
.meta b{color:var(--fg);font-weight:600}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;color:var(--mut);font-size:12px;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.note{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.6}
.warn{background:var(--warnbg);color:var(--warnfg);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-top:8px;line-height:1.5}
.empty{padding:16px 8px;text-align:center;color:var(--mut);font-size:13px;background:#fafafb;border-radius:8px}
.kpi{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.kbig{font-size:38px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.kbig small{font-size:18px;font-weight:600;margin-left:1px}
.klab{font-size:12.5px;color:var(--mut)}
.pbar{position:relative;height:12px;background:#e1e7f6;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:6px}
.pbar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ff9f0a}
.pbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.tile{background:#f7f8fa;border-radius:10px;padding:8px 10px}
.tile span{display:block;font-size:12px;color:var(--mut)}
.tile b{display:block;font-size:18px;font-weight:700;line-height:1.3}
.tile small{display:block;font-size:11.5px;color:var(--mut)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 5px;text-align:right;border-bottom:1px solid #f1f2f4;white-space:nowrap}
th{font-weight:600;color:#555;font-size:12px;background:#fafafb}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:#f4f7ff;font-weight:600}
.ms{display:inline-block;font-size:11px;border-radius:8px;padding:0 6px;margin-left:4px;background:#fff4dc;color:#8a5a00;font-weight:600}
.cv svg{display:block;width:100%;height:auto}
.lg{font-size:11.5px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;align-items:center}
.lg i{display:inline-block;width:14px;height:0;border-top:2px dashed #9aa3b5;vertical-align:3px;margin-right:4px}
.lg i.a{border-top:2px solid var(--acc)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;height:32px;margin-left:auto}
.seg button{border:0;background:#fff;font:inherit;font-size:12.5px;color:#555;padding:0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
footer{color:var(--mut);font-size:12px;text-align:center;padding:14px 0 6px;line-height:1.7}footer a{color:var(--mut)}
@media (min-width:760px){
 header{margin:0 0 12px;border:1px solid var(--bd);border-top:0;border-radius:0 0 14px 14px;padding:16px 18px 12px}
 h1{font-size:21px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;margin-bottom:10px}
 .grid2>.card{margin-bottom:0}
 .tiles{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<style>.stab{background:#fff;border-bottom:1px solid #e8e8ec;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab>div{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#6b7280;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab a.on{color:#2f6fed;border-bottom-color:#2f6fed}@media (max-width:759px){.stab a{flex:1;text-align:center;padding:0 6px}}</style><nav class="stab" aria-label="看板切换"><div><a href="../">10日新高</a><a href="../market/">大盘盘面</a><a href="../plan/" class="on" aria-current="page">10倍计划</a></div></nav>
<div class="wrap">
<header>
 <h1>10倍计划 · 自动进度</h1>
 <div class="meta" id="hmeta"><span>加载中…</span></div>
</header>
<div id="err"></div>
<div class="grid2">
<section class="card"><h2>总进度 <small id="progsub"></small></h2><div id="prog"></div></section>
<section class="card"><h2>本期 <small id="persub"></small></h2><div id="per"></div></section>
</div>
<section class="card"><h2>与计划对比 <small>计划曲线按天连续复利</small></h2><div id="cmp"></div></section>
<section class="card"><h2>倍数曲线 <small>计划 vs 实际</small></h2><div class="cv" id="cv"></div>
 <div class="lg"><span><i></i>计划</span><span><i class="a"></i>实际</span><div class="seg" id="seg"><button type="button" data-v="near" class="on">近期</button><button type="button" data-v="all">全程</button></div></div></section>
<section class="card"><h2>计划日期表 <small>每期14天 · 每期目标 +11.25%</small></h2><div class="tw" id="tbl"></div>
 <div class="note">第22期目标为 10.44x（按每期 +11.25% 复利第22期首次超过 10x），即达成 10 倍目标。</div></section>
<div class="note" style="padding:0 4px">只显示倍数和百分比，不显示金额；入金/划转已剔除，只算交易收益（按份额净值法，含未实现盈亏）；每 30 分钟自动更新。</div>
<footer>仅供个人记录参考，不构成投资建议<br><a href="https://github.com/Bibrady/a-share-board">github.com/Bibrady/a-share-board</a></footer>
</div>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)},D=null,VIEW="near",LN10=Math.log(10);
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function x(m,d){return (m==null||!isFinite(m))?"—":m.toFixed(d==null?3:d)+"x"}
function pc(v,d){return (v>=0?"+":"")+(v*100).toFixed(d==null?2:d)+"%"}
function cls(v){return v>0?"up":v<0?"down":""}
function pt(s){var a=s.split(/[- :]/);return Date.UTC(+a[0],a[1]-1,+a[2],(+a[3]||0)-8,+a[4]||0)}  // Beijing time -> epoch ms
function md(s){return s.slice(5,10)}
function load(){
 var u="data.json?t="+Date.now();
 return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
  .catch(function(){return fetch("https://raw.githubusercontent.com/Bibrady/a-share-board/main/plan/data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})});
}
function render(){
 var d=D,R=d.rate,P=d.period_days,N=d.n,g=Math.log(1+R),S=pt(d.start),now=pt(d.updated);
 var el=(now-S)/864e5,m=d.nav,k=d.period,day=d.day;
 var prog=Math.max(0,Math.log(m)/LN10),planM=Math.pow(1+R,el/P),planProg=Math.log(planM)/LN10;
 $("hmeta").innerHTML="<span>当前 <b>"+x(m)+"</b></span><span>更新 <b>"+esc(d.updated)+"</b> 北京时间</span><span>起点 "+esc(d.start.slice(0,10))+"</span>";
 $("progsub").textContent="目标 10x · 共"+N+"期";
 $("prog").innerHTML='<div class="kpi"><div><div class="klab">当前倍数</div><div class="kbig '+cls(m-1)+'">'+m.toFixed(3)+'<small>x</small></div></div>'+
  '<div><div class="klab">复利进度</div><div class="kbig" style="font-size:28px">'+(prog*100).toFixed(1)+'<small>%</small></div></div></div>'+
  '<div class="pbar"><i style="width:'+Math.min(100,prog*100).toFixed(2)+'%"></i><em style="left:'+Math.min(100,Math.max(0,planProg*100)).toFixed(2)+'%"></em></div>'+
  '<div class="pbl"><span>1x</span><span>橙线 = 今日计划 '+(planProg*100).toFixed(1)+'%</span><span>10x</span></div>'+
  '<div class="note">复利进度 = ln(当前倍数) / ln(10)，例如 2x ≈ 30.1%，3.16x = 50%。</div>';
 var s0=Math.pow(1+R,k-1),t1=Math.pow(1+R,k),done=(m/s0-1)/R,need=t1/m-1,pd=d.periods[k-1];
 $("persub").textContent="结算日 "+pd.end;
 $("per").innerHTML='<div class="kpi"><div><div class="klab">第 '+k+'/'+N+' 期</div><div class="kbig" style="font-size:28px">第 '+day+'<small>/'+P+' 天</small></div></div>'+
  '<div><div class="klab">本期已完成</div><div class="kbig '+cls(done)+'" style="font-size:28px">'+(done*100).toFixed(1)+'<small>%</small></div></div></div>'+
  '<div class="pbar"><i style="width:'+Math.min(100,Math.max(0,done*100)).toFixed(2)+'%"></i><em style="left:'+(Math.min(day,P)/P*100).toFixed(2)+'%"></em></div>'+
  '<div class="pbl"><span>'+x(s0)+'</span><span>橙线 = 时间进度</span><span>'+x(t1)+'</span></div>'+
  '<div class="tiles"><div class="tile"><span>本期起点</span><b>'+x(s0)+'</b>'+(d.period_start_actual!=null&&k>1?'<small>实际期初 '+x(d.period_start_actual)+'</small>':'<small>计划倍数</small>')+'</div>'+
  '<div class="tile"><span>本期目标</span><b>'+x(t1)+'</b><small>+11.25%</small></div>'+
  '<div class="tile"><span>还差</span><b class="'+(need>0?'':'up')+'">'+(need>0?pc(need):'已达成')+'</b><small>距本期目标</small></div>'+
  '<div class="tile"><span>剩余天数</span><b>'+Math.max(0,(S+k*P*864e5-now)/864e5).toFixed(1)+' 天</b><small>至 '+md(pd.end)+'</small></div></div>';
 var tStar=P*Math.log(m)/g,ahead=tStar-el,ad=Math.abs(ahead);
 var aheadTxt=ad<0.05?'与计划持平':(ahead>0?'领先计划 <b class="up">'+ad.toFixed(1)+' 天</b>':'落后计划 <b class="down">'+ad.toFixed(1)+' 天</b>');
 var eq=new Date(S+tStar*864e5+8*36e5),eqs=eq.getUTCFullYear()+"-"+("0"+(eq.getUTCMonth()+1)).slice(-2)+"-"+("0"+eq.getUTCDate()).slice(-2);
 $("cmp").innerHTML='<div class="tiles"><div class="tile"><span>今日计划倍数</span><b>'+x(planM)+'</b><small>第 '+el.toFixed(1)+' 天</small></div>'+
  '<div class="tile"><span>实际倍数</span><b class="'+cls(m-planM)+'">'+x(m)+'</b><small>差 '+pc(m/planM-1)+'</small></div></div>'+
  '<div class="warn" style="background:#f4f7ff;color:#1d1d1f">'+aheadTxt+'（当前倍数对应计划曲线上的 '+(tStar>=0?eqs:'起点之前')+'）</div>';
 // table
 var MS={2:0,3:0,5:0,10:0},msAt={};[2,3,5,10].forEach(function(v){msAt[Math.ceil(Math.log(v)/g-1e-9)]=v});
 var h='<table><thead><tr><th>期</th><th>结算日期</th><th>目标倍数</th><th>实际倍数</th><th>状态</th></tr></thead><tbody>';
 d.periods.forEach(function(p){
  var st,a=p.actual,cur=p.k===k&&now<S+p.k*P*864e5;
  if(a!=null)st=a>=p.target?"✅ 达成":"❌ 未达";else if(cur)st="⏳ 进行中";else if(p.k<k)st="…结算中";else st="— 未开始";
  h+='<tr'+(cur?' class="cur"':'')+'><td>'+p.k+(msAt[p.k]?'<span class="ms">'+msAt[p.k]+'x</span>':'')+'</td><td>'+p.end+'</td><td>'+(p.k===N?'10x <small style="color:#8a8f98">('+p.target.toFixed(2)+')</small>':x(p.target))+'</td><td class="'+(a!=null?cls(a-p.target):'')+'">'+(a!=null?x(a):cur?'<span style="color:#8a8f98">'+x(m)+'</span>':'—')+'</td><td>'+st+'</td></tr>';
 });
 $("tbl").innerHTML=h+'</tbody></table>';
 chart(d,S,now,el,g,P,N);
}
function chart(d,S,now,el,g,P,N){
 var W=360,H=220,L=38,Rr=8,T=10,B=24,all=VIEW==="all";
 var hs=d.hist.map(function(p){return[(pt(p[0])-S)/864e5,p[1]]});
 var x1=all?N*P:Math.max(P,Math.ceil((el+7)/P)*P),x0=0;
 var planAt=function(t){return Math.pow(1+d.rate,t/P)};
 var ys=hs.map(function(p){return p[1]}).concat([planAt(x1),1]),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 var logY=all,f=logY?Math.log:function(v){return v};
 if(!logY){var pad=(y1-y0)*0.08||0.02;y0-=pad;y1+=pad}else{y0=Math.min(y0,1);y1=Math.max(y1,10.5)}
 var X=function(t){return L+(t-x0)/(x1-x0)*(W-L-Rr)},Y=function(v){return T+(f(y1)-f(v))/(f(y1)-f(y0))*(H-T-B)};
 var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="计划与实际倍数曲线">';
 var ticks=logY?[1,2,3,5,10]:(function(){var st=[0.01,0.02,0.05,0.1,0.2,0.5,1].find(function(v){return (y1-y0)/v<=6})||1,a=[];for(var v=Math.ceil(y0/st)*st;v<=y1;v+=st)a.push(+v.toFixed(3));return a})();
 ticks.forEach(function(v){var y=Y(v);s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y+'" y2="'+y+'" stroke="#eef0f3"/><text x="'+(L-4)+'" y="'+(y+3.5)+'" font-size="10" text-anchor="end" fill="#8a8f98">'+(logY?v:v.toFixed(v<2&&!logY?2:1))+'x</text>'});
 for(var k=0;k<=x1/P;k++){var t=k*P;if(all&&k%4&&k!==N)continue;var dd=new Date(S+t*864e5+8*36e5);
  s+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#f3f4f6"/><text x="'+X(t)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#8a8f98">'+(dd.getUTCMonth()+1)+'/'+dd.getUTCDate()+'</text>'}
 var pp=[];for(var i=0;i<=120;i++){var t=x0+(x1-x0)*i/120;pp.push(X(t).toFixed(1)+","+Y(planAt(t)).toFixed(1))}
 s+='<polyline points="'+pp.join(" ")+'" fill="none" stroke="#9aa3b5" stroke-width="1.6" stroke-dasharray="5 4"/>';
 var ap=hs.filter(function(p){return p[0]<=x1}).map(function(p){return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)});
 if(ap.length)s+='<polyline points="'+ap.join(" ")+'" fill="none" stroke="#2f6fed" stroke-width="2.2" stroke-linejoin="round"/>';
 var lp=hs[hs.length-1];if(lp&&lp[0]<=x1)s+='<circle cx="'+X(lp[0])+'" cy="'+Y(lp[1])+'" r="3.5" fill="#2f6fed"/>';
 s+='<line x1="'+X(el)+'" x2="'+X(el)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#ff9f0a" stroke-width="1" stroke-dasharray="2 3"/></svg>';
 $("cv").innerHTML=s+(all?'<div class="note">全程视图为对数纵轴。</div>':'');
}
$("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;VIEW=b.getAttribute("data-v");[].forEach.call(this.children,function(c){c.classList.toggle("on",c===b)});if(D)render()});
function go(){load().then(function(d){D=d;$("err").innerHTML="";render()}).catch(function(e){if(!D)$("err").innerHTML='<div class="card"><div class="empty">数据加载失败（'+esc(e.message)+'），稍后自动重试</div></div>'})}
go();setInterval(function(){if(!document.hidden)go()},5*60*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)go()});
})();
</script>
</body>
</html>
