<style>
:root{--bg:#F7F5F0;--tx:#333;--ink:#1A1A1A;--acc:#1A3A6B;--grid:#E5E2DA;--mute:#888;
--mono:"IBM Plex Mono","SF Mono",SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
h1{margin:0 0 4px;font-size:20px;font-weight:700;color:var(--ink)}
.sub{margin:0 0 14px;font-size:13px;color:var(--mute)}

input{width:100%;font-family:var(--mono);font-size:20px;padding:10px 12px;border:1px solid var(--grid);border-radius:4px;background:#FBF9F4;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--acc);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}

tr.tot td{border-bottom:none;font-weight:700;color:var(--ink)}

<style>.stab{background:#FFFFFF;border-top:2px solid #1A3A6B;border-bottom:1px solid #E5E2DA;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab .stab-g,.stab .stab-s{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab .stab-g a,.stab .stab-s a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#666666;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab .stab-g a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}.stab .stab-s{border-top:1px solid #E5E2DA;background:#FBF9F4}.stab .stab-s a{height:38px;line-height:38px;font-size:14px;font-weight:600;color:#666666}.stab .stab-s a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}@media (max-width:759px){.stab .stab-g a,.stab .stab-s a{flex:1;text-align:center;padding:0 2px;font-size:13px}.stab .stab-s a{font-size:12.5px;height:36px;line-height:36px}}@media (max-width:420px){.stab .stab-g,.stab .stab-s{gap:0}.stab .stab-g a{font-size:13px;padding:0 1px}.stab .stab-s a{font-size:12px;padding:0 1px}}@media (max-width:350px){.stab .stab-g a,.stab .stab-s a{font-size:11px}}</style><nav class="stab" aria-label="看板分类"><div class="stab-g" role="navigation" aria-label="大类"><a href="../market/">A股</a><a href="../us/">美股</a><a href="../">选股</a><a href="../pos/" class="on">仓位管理</a><a href="../fitness/">生活</a></div><div class="stab-s" role="navigation" aria-label="子看板"><a href="../pos/">仓位</a><a href="../be/">持仓保本</a><a href="../compound/">复利计算</a><a href="../pyramid/" class="on" aria-current="page">倒金字塔</a></div></nav>
<div class="wrap">
<h1>倒金字塔仓位计算</h1>
<p class="sub">输入这次计划使用的总保证金，按 15% / 35% / 50% 分三次建仓。</p>
<div class="card"><div class="row">
<div style="flex:2"><label for="m">总保证金（U）</label><input id="m" type="number" inputmode="decimal" min="0" step="any" placeholder="例如 1000"></div>
<div><label for="lv">杠杆（倍）</label><input id="lv" type="number" inputmode="decimal" min="1" step="any" value="5"></div>
</div></div>
<div class="card"><table>
<thead><tr><th>批次</th><th>比例</th><th>保证金 U</th><th>名义仓位 U</th><th>累计保证金</th><th>累计名义</th></tr></thead>
<tbody id="tb"></tbody></table>
<p class="note">名义仓位 = 保证金 × 杠杆。累计 = 打完该批后的合计。</p></div>
</div>
<script>
(function(){
var K='pyramid_calc_v1',P=[['第一批',.15],['第二批',.35],['第三批',.50]];
var m=document.getElementById('m'),lv=document.getElementById('lv'),tb=document.getElementById('tb');
function f(x){return isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}
function calc(){
 var M=parseFloat(m.value),L=parseFloat(lv.value);if(!(L>0))L=5;var ok=M>0,cm=0,h='';
 P.forEach(function(p){var a=ok?M*p[1]:NaN;cm+=a;
  h+='<tr><td>'+p[0]+'</td><td>'+(p[1]*100)+'%</td><td class="big">'+f(a)+'</td><td>'+f(a*L)+'</td><td>'+f(cm)+'</td><td>'+f(cm*L)+'</td></tr>'});
 h+='<tr class="tot"><td>合计</td><td>100%</td><td>'+f(ok?M:NaN)+'</td><td>'+f(ok?M*L:NaN)+'</td><td></td><td></td></tr>';
 tb.innerHTML=h;
 try{localStorage.setItem(K,JSON.stringify({m:m.value,lv:lv.value}))}catch(e){}
}
try{var s=JSON.parse(localStorage.getItem(K)||'null');if(s){if(s.m!=null)m.value=s.m;if(s.lv)lv.value=s.lv}}catch(e){}
m.addEventListener('input',calc);lv.addEventListener('input',calc);calc();
})();
</script>
