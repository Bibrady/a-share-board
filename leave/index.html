<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>朔元 · 请假审批</title>
<meta name="description" content="朔元内部请假审批工作台">
<meta name="theme-color" content="#F7F5F0">

<style>
:root{color-scheme:light;--bd:#E5E2DA;--bg:#F7F5F0;--fg:#333333;--mut:#666666;--acc:#1A3A6B;--ttl:#1A3A6B;--pn:#FFFFFF;--pn2:#FBF9F4;--grid:#E5E2DA;--dim:#888888;--danger:#8A1F1F;--mono:"IBM Plex Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--bd);border-top:0;padding:18px 20px 16px;margin:0 -16px 20px}
.brand{display:flex;align-items:flex-start;gap:12px;min-width:0}
.mark{flex:none;background:var(--acc);color:#fff;font-size:13px;font-weight:700;letter-spacing:.18em;padding:7px 9px;line-height:1}
.brand h1{margin:0;font-size:20px;font-weight:650;color:var(--ttl);letter-spacing:.02em}
.who{display:flex;align-items:center;gap:10px;flex:none}
.who-t{text-align:right;white-space:nowrap}
.who-t b{display:block;font-size:13.5px;font-weight:650}
.who-t span{display:block;font-size:12px;color:var(--mut)}
.panel{background:var(--pn);border:1px solid var(--bd);padding:22px 22px 20px;margin-bottom:16px}
.panel h2{margin:0 0 14px;font-size:15px;font-weight:650;color:var(--ttl);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.panel h2 .ttl{flex:none;white-space:nowrap}
.panel h2 small{font-weight:400;color:var(--mut);font-size:12.5px;line-height:1.45}
.lead{margin:0 0 16px;color:var(--mut);font-size:13.5px;line-height:1.65;max-width:46em;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--pn);border:1px solid var(--bd);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--mut);letter-spacing:.04em}
.kpi .v{margin-top:6px;font-size:28px;font-weight:700;color:var(--ttl);font-family:var(--mono);line-height:1.1;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut)}
label.fld span.req::after{content:" *";color:var(--danger)}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;border:1px solid var(--bd);background:#fff;color:var(--fg);border-radius:0;padding:0 10px;min-height:40px}
textarea{padding:8px 10px;min-height:88px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.hint{font-size:12px;color:var(--mut);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:40px;padding:0 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;border-radius:0}
.btn:disabled{background:#C8C4BA;border-color:#C8C4BA;color:#666;cursor:default}
.btn.ghost{background:#fff;color:var(--acc)}
.btn.quiet{background:#fff;color:var(--mut);border-color:var(--bd)}
.btn.warn{background:#fff;color:var(--danger);border-color:rgba(183,28,28,.45)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.filters input,.filters select{width:auto;min-width:0;height:36px;min-height:36px}
.tw{overflow:auto;border:1px solid var(--grid);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:12px;font-weight:650;color:var(--mut);background:var(--pn2);padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.muted, .muted{color:var(--mut)}
td.reason{max-width:220px;white-space:pre-wrap;word-break:break-word}
tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:12px;font-weight:650;white-space:nowrap}
.badge.pending{color:var(--acc);background:rgba(26,58,107,.08);border:1px solid rgba(26,58,107,.25)}
.badge.approved{color:#1A1A1A;background:#EFEDE6;border:1px solid var(--bd)}
.badge.rejected{color:var(--danger);background:rgba(183,28,28,.08);border:1px solid rgba(183,28,28,.25)}
.badge.cancelled{color:var(--mut);background:#F4F2EC;border:1px solid var(--bd)}
.cards{display:none}
.card{border:1px solid var(--bd);padding:12px 12px 10px;margin-bottom:8px;background:#fff}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.card .id{font-family:var(--mono);font-size:12.5px;font-weight:650}
.card .meta{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 10px;margin:4px 0}
.card .why{font-size:13px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.empty{padding:28px 12px;text-align:center;color:var(--mut);background:var(--pn2);border:1px dashed var(--bd);font-size:13.5px;line-height:1.65}
.banner{margin-bottom:16px;padding:10px 12px;border:1px solid var(--bd);background:rgba(26,58,107,.08);color:var(--ttl);font-size:13.5px}
.banner.err{background:rgba(183,28,28,.08);border-color:rgba(183,28,28,.35);color:var(--danger)}
.banner.ok{background:#EFEDE6}
.agenda li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.agenda li:last-child{border-bottom:0}
.agenda b{font-weight:650}
.tag{font-size:11.5px;color:var(--mut);letter-spacing:.04em}
#dlg{border:1px solid var(--bd);padding:0;max-width:420px;width:calc(100% - 24px);background:#fff}
#dlg::backdrop{background:rgba(26,26,26,.45)}
.dlg-bd{padding:20px 20px 16px}
.dlg-bd h3{margin:0 0 8px;font-size:16px;color:var(--ttl)}
.dlg-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--bd);background:var(--pn2)}
[hidden]{display:none !important}
@media (max-width:759px){
  .wrap{padding:0 12px 32px}
  .top{margin:0 -12px 16px;padding:14px 12px 12px}
  .panel{padding:16px 14px}
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:24px}
  .tw{display:none}
  .cards{display:block}
  .who-t{text-align:right}
  .who-t span{display:none}
  .brand h1{font-size:18px}
  .panel h2{display:block}
  .panel h2 small{display:block;margin-top:4px}
}
@media (min-width:760px){
  body{font-size:14.5px}
  .top{margin:0 0 20px;border-top:1px solid var(--bd)}
}
</style>
</head>

<!--SITE_NAV--><style>.stab{background:#FFFFFF;border-top:2px solid #1A3A6B;border-bottom:1px solid #E5E2DA;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab .stab-g,.stab .stab-s{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab .stab-g a,.stab .stab-s a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#666666;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab .stab-g a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}.stab .stab-s{border-top:1px solid #E5E2DA;background:#FBF9F4}.stab .stab-s a{height:38px;line-height:38px;font-size:14px;font-weight:600;color:#666666}.stab .stab-s a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}@media (max-width:759px){.stab .stab-g a,.stab .stab-s a{flex:1;text-align:center;padding:0 2px;font-size:13px}.stab .stab-s a{font-size:12.5px;height:36px;line-height:36px}}@media (max-width:420px){.stab .stab-g,.stab .stab-s{gap:0}.stab .stab-g a{font-size:13px;padding:0 1px}.stab .stab-s a{font-size:12px;padding:0 1px}}@media (max-width:350px){.stab .stab-g a,.stab .stab-s a{font-size:11px}}</style><nav class="stab" aria-label="看板分类"><div class="stab-g" role="navigation" aria-label="大类"><a href="../market/">A股</a><a href="../us/">美股</a><a href="../">选股</a><a href="../pages/ai-evo/">研究</a><a href="./" class="on">办公</a></div><div class="stab-s" role="navigation" aria-label="子看板"><a href="./" class="on" aria-current="page">请假审批</a><a href="../chat/">内部聊天</a></div></nav>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">朔元</div>
      <div>
        <h1>请假审批</h1>
      </div>
    </div>
    <div class="who">
      <div class="who-t"><b>卓炀</b><span>提交 / 审批</span></div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="kpis" aria-label="审批总览">
    <div class="kpi"><div class="l">待审批</div><div class="v" id="kPending">0</div></div>
    <div class="kpi"><div class="l">已通过</div><div class="v" id="kApproved">0</div></div>
    <div class="kpi"><div class="l">已驳回</div><div class="v" id="kRejected">0</div></div>
    <div class="kpi"><div class="l">进行中</div><div class="v" id="kOngoing">0</div></div>
  </section>

  <section class="panel" id="secAgenda">
    <h2><span class="ttl">即将开始 / 进行中</span> <small>仅统计已通过且尚未结束的假期</small></h2>
    <ul class="agenda" id="agenda"></ul>
    <div class="empty" id="agendaEmpty">目前没有即将开始或正在进行的已通过假期。</div>
  </section>

  <section class="panel">
    <h2><span class="ttl">提交请假</span> <small>天数按自然日（含周末）预填，可改为 0.5 的倍数</small></h2>
    <form id="form" class="form" novalidate>
      <label class="fld"><span class="req">请假类型</span>
        <select id="fType" required>
          <option value="年假">年假</option>
          <option value="事假">事假</option>
          <option value="病假">病假</option>
          <option value="调休">调休</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <label class="fld"><span>申请人</span>
        <select id="fApplicant"></select>
      </label>
      <label class="fld"><span class="req">开始日期</span>
        <input id="fStart" type="date" required>
      </label>
      <label class="fld"><span class="req">结束日期</span>
        <input id="fEnd" type="date" required>
      </label>
      <label class="fld"><span class="req">天数</span>
        <input id="fDays" type="number" min="0.5" step="0.5" required>
        <span class="hint" id="fDaysHint"></span>
      </label>
      <label class="fld full"><span class="req">事由</span>
        <textarea id="fReason" maxlength="500" placeholder="请说明请假原因，便于审批留档。" required></textarea>
      </label>
      <div class="full actions">
        <button type="submit" class="btn" id="btnSubmit">提交申请</button>
        <span class="hint" id="formMsg"></span>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2><span class="ttl">请假单据</span> <small id="listMeta"></small></h2>
    <div class="filters">
      <label>状态
        <select id="qStatus">
          <option value="">全部</option>
          <option value="待审批">待审批</option>
          <option value="已通过">已通过</option>
          <option value="已驳回">已驳回</option>
          <option value="已撤销">已撤销</option>
        </select>
      </label>
      <label>从 <input id="qFrom" type="date"></label>
      <label>至 <input id="qTo" type="date"></label>
      <button type="button" class="btn quiet sm" id="btnReset">重置筛选</button>
    </div>
    <div class="tw" id="tw">
      <table>
        <thead>
          <tr>
            <th>单号</th>
            <th>申请人</th>
            <th>类型</th>
            <th>期间</th>
            <th class="num">天数</th>
            <th>事由</th>
            <th>状态</th>
            <th>审批</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="listEmpty" hidden>没有符合条件的请假单。</div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="dlgForm">
    <div class="dlg-bd">
      <h3 id="dlgTitle">审批请假单</h3>
      <p class="lead" id="dlgLead"></p>
      <label class="fld" id="dlgCommentWrap"><span id="dlgCommentLabel">审批意见</span>
        <textarea id="dlgComment" maxlength="200" placeholder="选填；驳回时请写明原因。"></textarea>
      </label>
    </div>
    <div class="dlg-ft">
      <button type="button" class="btn quiet" id="dlgCancel">取消</button>
      <button type="submit" class="btn" id="dlgOk">确认</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var TZ = 'Asia/Shanghai';
  var STORE_KEY = 'shuoyuan_leave_v4';
  var OPERATOR = '卓炀';
  var STAFF = ['林知夏', '周晏清', '陈予白'];
  var TYPES = ['年假', '事假', '病假', '调休', '其他'];
  var STATUS_PENDING = '待审批';
  var STATUS_APPROVED = '已通过';
  var STATUS_REJECTED = '已驳回';
  var STATUS_CANCELLED = '已撤销';
  var state = { requests: [], decision: null };

  function rec(id, name, type, start, end, days, reason, status, submittedAt, reviewer, reviewedAt, comment) {
    return {
      id: id, applicantName: name, type: type, startDate: start, endDate: end, days: days,
      reason: reason, status: status, submittedAt: submittedAt,
      reviewerName: reviewer || '', reviewedAt: reviewedAt || '', comment: comment || ''
    };
  }

  var SEED = [
    rec('SY-20260310-001', '陈予白', '事假', '2026-03-12', '2026-03-12', 1, '搬家验房', '已通过', '2026-03-10 10:22:00', '卓炀', '2026-03-10 14:08:00', ''),
    rec('SY-20260608-001', '周晏清', '调休', '2026-06-18', '2026-06-18', 1, '抵月初加班，衔接端午', '已通过', '2026-06-08 14:02:00', '卓炀', '2026-06-09 09:31:00', ''),
    rec('SY-20260814-001', '周晏清', '事假', '2026-08-16', '2026-08-16', 1, '回老家办事', '已通过', '2026-08-14 09:47:00', '卓炀', '2026-08-14 11:16:00', ''),
    rec('SY-20260916-001', '林知夏', '病假', '2026-09-18', '2026-09-18', 0.5, '上午去医院复查', '已通过', '2026-09-16 16:40:00', '卓炀', '2026-09-16 17:05:00', ''),
    rec('SY-20261020-001', '陈予白', '年假', '2026-10-26', '2026-10-27', 2, '回长沙家里', '已通过', '2026-10-20 09:33:00', '卓炀', '2026-10-21 10:17:00', ''),
    rec('SY-20261124-001', '林知夏', '事假', '2026-11-26', '2026-11-26', 1, '家里有事，请全天', '已通过', '2026-11-24 16:28:00', '卓炀', '2026-11-25 09:12:00', ''),
    rec('SY-20261125-001', '卓炀', '病假', '2026-11-26', '2026-11-27', 2, '身体不适', '已通过', '2026-11-25 18:41:00', '卓炀', '2026-11-25 19:06:00', '')
  ];

  var $ = function (id) { return document.getElementById(id); };
  var banner = $('banner');

  function todayYmd() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  function nowText() {
    var t = new Intl.DateTimeFormat('en-GB', {
      timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).format(new Date());
    return todayYmd() + ' ' + t;
  }

  function naturalDays(start, end) {
    if (!start || !end) return 0;
    var a = start.split('-').map(Number);
    var b = end.split('-').map(Number);
    if (a.length !== 3 || b.length !== 3) return 0;
    var da = Date.UTC(a[0], a[1] - 1, a[2]);
    var db = Date.UTC(b[0], b[1] - 1, b[2]);
    return Math.round((db - da) / 86400000) + 1;
  }

  function fmtDays(n) {
    if (n == null || n === '') return '—';
    var x = Number(n);
    if (!isFinite(x)) return String(n);
    return (Math.round(x * 2) / 2).toString();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function showBanner(msg, kind) {
    if (!msg) { banner.hidden = true; banner.textContent = ''; return; }
    banner.hidden = false;
    banner.className = 'banner' + (kind ? ' ' + kind : '');
    banner.textContent = msg;
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { created: [], updates: {} };
      var data = JSON.parse(raw);
      return {
        created: Array.isArray(data.created) ? data.created : [],
        updates: data.updates && typeof data.updates === 'object' ? data.updates : {}
      };
    } catch (e) {
      showBanner('本机记录读取失败。若曾手动改过浏览器存储，请清除本站数据后重试。', 'err');
      return { created: [], updates: {} };
    }
  }

  function assemble() {
    var loc = loadLocal();
    var seedIds = {};
    var rows = SEED.map(function (s) {
      seedIds[s.id] = true;
      var u = loc.updates[s.id];
      return u ? Object.assign({}, s, u) : Object.assign({}, s);
    });
    loc.created.forEach(function (r) {
      if (r && r.id && !seedIds[r.id]) rows.push(r);
    });
    rows.sort(function (a, b) {
      if (a.submittedAt === b.submittedAt) return a.id < b.id ? 1 : -1;
      return a.submittedAt < b.submittedAt ? 1 : -1;
    });
    return rows;
  }

  function saveStore() {
    var seedById = {};
    SEED.forEach(function (s) { seedById[s.id] = s; });
    var created = [];
    var updates = {};
    state.requests.forEach(function (r) {
      var s = seedById[r.id];
      if (s) {
        if (r.status !== s.status || r.comment !== s.comment || r.reviewerName !== s.reviewerName || r.reviewedAt !== s.reviewedAt) {
          updates[r.id] = {
            status: r.status,
            reviewerName: r.reviewerName,
            reviewedAt: r.reviewedAt,
            comment: r.comment
          };
        }
      } else {
        created.push(r);
      }
    });
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ created: created, updates: updates }));
      return true;
    } catch (e) {
      showBanner('无法写入本机存储。请检查浏览器是否禁用了本地存储，或存储空间是否已满。', 'err');
      return false;
    }
  }

  function reviewerFor() {
    return OPERATOR;
  }

  function nextId(today) {
    var prefix = 'SY-' + today.replace(/-/g, '') + '-';
    var maxn = 0;
    state.requests.forEach(function (r) {
      if (r.id && r.id.indexOf(prefix) === 0) {
        var n = parseInt(r.id.slice(prefix.length), 10);
        if (n > maxn) maxn = n;
      }
    });
    var next = String(maxn + 1);
    while (next.length < 3) next = '0' + next;
    return prefix + next;
  }

  function summarize() {
    var today = todayYmd();
    var pending = 0, approved = 0, rejected = 0;
    var agenda = [];
    state.requests.forEach(function (r) {
      if (r.status === STATUS_PENDING) pending++;
      else if (r.status === STATUS_APPROVED) approved++;
      else if (r.status === STATUS_REJECTED) rejected++;
      if (r.status === STATUS_APPROVED && r.startDate && r.endDate) {
        var kind = '';
        if (r.startDate <= today && today <= r.endDate) kind = 'ongoing';
        else if (r.startDate > today) kind = 'upcoming';
        if (kind) {
          agenda.push({
            id: r.id, kind: kind, applicantName: r.applicantName, type: r.type,
            startDate: r.startDate, endDate: r.endDate, days: r.days
          });
        }
      }
    });
    agenda.sort(function (a, b) {
      if (a.startDate === b.startDate) return a.id < b.id ? -1 : 1;
      return a.startDate < b.startDate ? -1 : 1;
    });
    return { pending: pending, approved: approved, rejected: rejected, agenda: agenda };
  }

  function refresh() {
    var s = summarize();
    $('kPending').textContent = s.pending;
    $('kApproved').textContent = s.approved;
    $('kRejected').textContent = s.rejected;
    var ongoing = s.agenda.filter(function (x) { return x.kind === 'ongoing'; }).length;
    $('kOngoing').textContent = ongoing;
    var ul = $('agenda');
    if (!s.agenda.length) {
      ul.innerHTML = '';
      $('agendaEmpty').hidden = false;
    } else {
      $('agendaEmpty').hidden = true;
      ul.innerHTML = s.agenda.map(function (x) {
        var tag = x.kind === 'ongoing' ? '进行中' : '即将开始';
        return '<li><div><b>' + esc(x.applicantName) + '</b> · ' + esc(x.type) +
          ' · ' + fmtDays(x.days) + ' 天<div class="muted">' + esc(x.startDate) + ' 至 ' + esc(x.endDate) +
          '</div></div><span class="tag">' + tag + '</span></li>';
      }).join('');
    }
    renderList();
  }

  function badge(status) {
    var cls = status === STATUS_PENDING ? 'pending'
      : status === STATUS_APPROVED ? 'approved'
      : status === STATUS_REJECTED ? 'rejected'
      : 'cancelled';
    return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }

  function filtered() {
    var st = $('qStatus').value;
    var from = $('qFrom').value;
    var to = $('qTo').value;
    return state.requests.filter(function (r) {
      if (st && r.status !== st) return false;
      var start = r.startDate || '';
      var end = r.endDate || '';
      if (from && end && end < from) return false;
      if (to && start && start > to) return false;
      return true;
    });
  }

  function rowActions(r) {
    if (r.status !== STATUS_PENDING) return '';
    return '<button type="button" class="btn sm" data-act="approve" data-id="' + esc(r.id) + '">通过</button> ' +
      '<button type="button" class="btn warn sm" data-act="reject" data-id="' + esc(r.id) + '">驳回</button> ' +
      '<button type="button" class="btn quiet sm" data-act="cancel" data-id="' + esc(r.id) + '">撤销</button>';
  }

  function reviewCell(r) {
    if (!r.reviewerName && !r.comment && !r.reviewedAt) return '<span class="muted">—</span>';
    var bits = [];
    if (r.reviewerName) bits.push(esc(r.reviewerName));
    if (r.reviewedAt) bits.push(esc(r.reviewedAt));
    var s = bits.join('<br>');
    if (r.comment) s += '<div class="muted">' + esc(r.comment) + '</div>';
    return s;
  }

  function renderList() {
    var rows = filtered();
    $('listMeta').textContent = '共 ' + state.requests.length + ' 张' + (rows.length !== state.requests.length ? '，筛选后 ' + rows.length + ' 张' : '');
    var empty = $('listEmpty');
    var tb = $('tb');
    var cards = $('cards');
    if (!rows.length) {
      tb.innerHTML = '';
      cards.innerHTML = '';
      $('tw').hidden = true;
      empty.hidden = false;
      empty.textContent = state.requests.length
        ? '没有符合当前筛选条件的请假单。可重置筛选或扩大日期范围。'
        : '尚无请假记录。提交申请后将出现在此列表。';
      return;
    }
    empty.hidden = true;
    $('tw').hidden = false;
    tb.innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td>' + esc(r.id) + '</td>' +
        '<td>' + esc(r.applicantName) + '</td>' +
        '<td>' + esc(r.type) + '</td>' +
        '<td>' + esc(r.startDate) + '<div class="muted">至 ' + esc(r.endDate) + '</div></td>' +
        '<td class="num">' + fmtDays(r.days) + '</td>' +
        '<td class="reason">' + esc(r.reason) + '</td>' +
        '<td>' + badge(r.status) + '</td>' +
        '<td>' + reviewCell(r) + '</td>' +
        '<td>' + (rowActions(r) || '<span class="muted">—</span>') + '</td>' +
        '</tr>';
    }).join('');
    cards.innerHTML = rows.map(function (r) {
      return '<article class="card">' +
        '<div class="hd"><span class="id">' + esc(r.id) + '</span>' + badge(r.status) + '</div>' +
        '<div class="meta"><span>' + esc(r.applicantName) + '</span><span>' + esc(r.type) + ' · ' + fmtDays(r.days) + ' 天</span>' +
        '<span>' + esc(r.startDate) + ' 至 ' + esc(r.endDate) + '</span></div>' +
        '<div class="why">' + esc(r.reason) + '</div>' +
        (r.comment ? '<div class="muted">审批意见：' + esc(r.comment) + '</div>' : '') +
        (r.status === STATUS_PENDING ? '<div class="actions" style="margin-top:8px">' + rowActions(r) + '</div>' : '') +
        '</article>';
    }).join('');
  }

  function findById(id) {
    for (var i = 0; i < state.requests.length; i++) {
      if (state.requests[i].id === id) return state.requests[i];
    }
    return null;
  }

  function openDecide(id, decision) {
    var r = findById(id);
    if (!r) return;
    state.decision = { id: id, decision: decision };
    var titles = { approve: '通过请假单', reject: '驳回请假单', cancel: '撤销请假单' };
    $('dlgTitle').textContent = titles[decision] || '处理请假单';
    $('dlgLead').textContent = r.id + ' · ' + r.applicantName + ' · ' + r.type + ' · ' + fmtDays(r.days) + ' 天（' + r.startDate + ' 至 ' + r.endDate + '）';
    if (decision === 'cancel') {
      $('dlgCommentLabel').textContent = '说明';
      $('dlgLead').textContent += '。撤销后不可恢复为待审批，如需请假请重新提交。';
      $('dlgCommentWrap').hidden = true;
    } else {
      $('dlgCommentLabel').textContent = decision === 'reject' ? '审批意见（必填）' : '审批意见（选填）';
      $('dlgCommentWrap').hidden = false;
    }
    $('dlgComment').value = '';
    $('dlgComment').required = decision === 'reject';
    $('dlgComment').placeholder = decision === 'reject' ? '请写明驳回原因。' : '选填。';
    $('dlgOk').textContent = decision === 'approve' ? '确认通过' : decision === 'reject' ? '确认驳回' : '确认撤销';
    $('dlgOk').className = 'btn' + (decision === 'approve' ? '' : ' warn');
    $('dlg').showModal();
  }

  function syncDays(fromDates) {
    var start = $('fStart').value;
    var end = $('fEnd').value;
    var n = naturalDays(start, end);
    $('fDaysHint').textContent = n > 0
      ? '起止共 ' + n + ' 个自然日（含周末）。可改为 0.5 的倍数，且不超过该自然日数。'
      : '请先选择开始与结束日期。';
    if (fromDates && n > 0) $('fDays').value = String(n);
    if (start) $('fEnd').min = start;
  }

  $('fStart').addEventListener('change', function () {
    if ($('fEnd').value && $('fEnd').value < $('fStart').value) $('fEnd').value = $('fStart').value;
    syncDays(true);
  });
  $('fEnd').addEventListener('change', function () { syncDays(true); });
  $('qStatus').addEventListener('change', renderList);
  $('qFrom').addEventListener('change', renderList);
  $('qTo').addEventListener('change', renderList);
  $('btnReset').addEventListener('click', function () {
    $('qStatus').value = '';
    $('qFrom').value = '';
    $('qTo').value = '';
    renderList();
  });

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var type = $('fType').value;
    var start = $('fStart').value;
    var end = $('fEnd').value;
    var days = Number($('fDays').value);
    var reason = $('fReason').value.trim();
    var n = naturalDays(start, end);
    var msg = $('formMsg');
    msg.textContent = '';
    if (TYPES.indexOf(type) === -1) { msg.textContent = '请选择请假类型。'; return; }
    if (!start || !end) { msg.textContent = '请填写开始与结束日期。'; return; }
    if (start > end) { msg.textContent = '结束日期不能早于开始日期。'; return; }
    if (!reason) { msg.textContent = '请填写请假事由。'; return; }
    if (!isFinite(days) || days < 0.5 || Math.round(days * 2) !== days * 2) {
      msg.textContent = '天数须为不小于 0.5 的 0.5 倍数。'; return;
    }
    if (n > 0 && days > n) {
      msg.textContent = '天数不能超过自然日数（' + n + ' 天）。排除周末请下调天数。'; return;
    }
    var applicant = $('fApplicant').value;
    if (STAFF.indexOf(applicant) === -1) { msg.textContent = '请选择申请人。'; return; }
    var rec = {
      id: nextId(todayYmd()),
      applicantName: applicant,
      type: type,
      startDate: start,
      endDate: end,
      days: days,
      reason: reason,
      status: STATUS_PENDING,
      submittedAt: nowText(),
      reviewerName: '',
      reviewedAt: '',
      comment: ''
    };
    state.requests.unshift(rec);
    if (!saveStore()) {
      state.requests.shift();
      return;
    }
    $('fReason').value = '';
    syncDays(true);
    refresh();
    showBanner('请假单已提交，状态为待审批。', 'ok');
  });

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var id = t.getAttribute('data-id');
    var act = t.getAttribute('data-act');
    if (act === 'approve' || act === 'reject' || act === 'cancel') openDecide(id, act);
  });

  $('dlgCancel').addEventListener('click', function () { $('dlg').close(); });
  $('dlgForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!state.decision) return;
    var comment = $('dlgComment').value.trim();
    var kind = state.decision.decision;
    if (kind === 'reject' && !comment) {
      showBanner('驳回时请填写审批意见。', 'err');
      return;
    }
    var rec = findById(state.decision.id);
    if (!rec) {
      showBanner('未找到该请假单。', 'err');
      return;
    }
    if (rec.status !== STATUS_PENDING) {
      showBanner('该单据已处理，当前状态为「' + rec.status + '」。', 'err');
      return;
    }
    var prev = { status: rec.status, reviewerName: rec.reviewerName, reviewedAt: rec.reviewedAt, comment: rec.comment };
    if (kind === 'approve') rec.status = STATUS_APPROVED;
    else if (kind === 'reject') rec.status = STATUS_REJECTED;
    else rec.status = STATUS_CANCELLED;
    rec.reviewerName = kind === 'cancel' ? rec.applicantName : reviewerFor();
    rec.reviewedAt = nowText();
    rec.comment = kind === 'cancel' ? '申请人撤销' : comment;
    if (!saveStore()) {
      rec.status = prev.status;
      rec.reviewerName = prev.reviewerName;
      rec.reviewedAt = prev.reviewedAt;
      rec.comment = prev.comment;
      return;
    }
    $('dlg').close();
    refresh();
    showBanner(kind === 'approve' ? '已通过该请假单。' : kind === 'reject' ? '已驳回该请假单。' : '已撤销该请假单。', 'ok');
  });

  $('fApplicant').innerHTML = STAFF.map(function (n) {
    return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
  }).join('');
  state.requests = assemble();
  var t = todayYmd();
  $('fStart').value = t;
  $('fEnd').value = t;
  syncDays(true);
  refresh();
})();
</script>
</body>
</html>
