<style>
:root{--bg:#F7F5F0;--tx:#333333;--ink:#1A1A1A;--acc:#1A3A6B;--grid:#E5E2DA;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Serif CJK SC","Source Han Serif SC","Songti SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45}
body .stab{background:#FFFFFF;border-bottom:1px solid var(--grid)}
body .stab a{color:#666666;font-weight:600}
body .stab a.on{color:var(--acc);border-bottom-color:var(--acc)}
.wrap{max-width:920px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

<body>
<style>.stab{background:#FFFFFF;border-top:2px solid #1A3A6B;border-bottom:1px solid #E5E2DA;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab>div{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#666666;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab a.on{color:#1A3A6B;border-bottom-color:#1A3A6B}@media (max-width:759px){.stab a{flex:1;text-align:center;padding:0 2px;font-size:13px}}@media (max-width:420px){.stab>div{gap:0}.stab a{font-size:12px;padding:0 1px}}@media (max-width:350px){.stab a{font-size:11px}}</style><nav class="stab" aria-label="看板切换"><div><a href="../">10日新高</a><a href="../market/">大盘盘面</a><a href="../us/">美股复盘</a><a href="../compound/" class="on" aria-current="page">复利计算</a><a href="../be/">持仓保本</a><a href="../pos/">仓位</a><a href="../val/">估值</a></div></nav>
<div class="wrap">
  <h1>10 倍</h1>
  <svg id="chart" viewBox="0 0 1200 680" role="img" aria-label="10 倍">
    <path id="base" fill="none" stroke="#E5E2DA" stroke-width="1.25"></path>
    <path id="curve" fill="none" stroke="#1A3A6B" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle id="mark" r="7" fill="#1A1A1A" stroke="#F7F5F0" stroke-width="3" display="none"></circle>
  </svg>
</div>
<script>
(function(){"use strict";
var VER="8d44e05688a6f0ec",NT="https://ntfy.sh/",LSK="be2_mk";
var N=17,G=1+3/20,P0=N*500,STEPS=96;
var TE=new TextEncoder(),K=null,TD="";
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(u){u=new Uint8Array(u);var s="";for(var i=0;i<u.length;i++)s+=(u[i]<16?"0":"")+u[i].toString(16);return s}
function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
function cat(a,b){var u=new Uint8Array(a.length+b.length);u.set(a,0);u.set(b,a.length);return u}
function sub(m,l){return crypto.subtle.digest("SHA-256",cat(m,TE.encode(l))).then(function(d){return new Uint8Array(d)})}
function setup(m){return sub(m,"be2/verify").then(function(v){if(hex(v).slice(0,16)!==VER)throw new Error("BADPW");
 return Promise.all([sub(m,"be2/aes"),sub(m,"be2/topic/data"),sub(m,"be2/topic/req")])}).then(function(r){
 TD="bd_"+hex(r[1]).slice(0,32);
 return crypto.subtle.importKey("raw",r[0],{name:"AES-GCM"},false,["decrypt"])}).then(function(k){K=k})}
function open_(env){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.i),additionalData:TE.encode("be2")},K,b64(env.d)).then(function(buf){
 if(!window.DecompressionStream)throw new Error("nodec");
 return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate"))).text()}).then(JSON.parse)}
var L=96,R=96,T=36,B=78,W=1200,H=680;
function yAt(t){return P0*Math.pow(G,t)}
var Y0=yAt(0),Y1=yAt(N);
function X(t){return L+(t/N)*(W-L-R)}
function Y(v){return T+(1-(v-Y0)/(Y1-Y0))*(H-T-B)}
function draw(){
 var d="",i,t;
 for(i=0;i<=STEPS;i++){
  t=N*i/STEPS;
  d+=(i?"L":"M")+X(t).toFixed(2)+","+Y(yAt(t)).toFixed(2);
 }
 document.getElementById("curve").setAttribute("d",d);
 document.getElementById("base").setAttribute("d","M"+L+","+(H-B)+"L"+(W-R)+","+(H-B));
}
function place(eq){
 var dot=document.getElementById("mark");
 if(eq==null||!isFinite(eq)||eq<Y0){dot.setAttribute("display","none");return}
 var t=Math.log(eq/Y0)/Math.log(G);
 if(!(t>=0)){dot.setAttribute("display","none");return}
 if(t>N)t=N;
 dot.setAttribute("cx",X(t).toFixed(2));
 dot.setAttribute("cy",Y(yAt(t)).toFixed(2));
 dot.setAttribute("display","inline");
}
function eqOf(d){var a=d&&d.acct;if(!a||a.eq==null||a.eq==="")return null;var x=+a.eq;return isFinite(x)?x:null}
function boot(){
 var mk=null;try{mk=localStorage.getItem(LSK)}catch(e){}
 if(!mk||!/^[0-9a-f]{64}$/.test(mk)||!window.crypto||!crypto.subtle)return;
 setup(unhex(mk)).then(function(){
  return fetch(NT+TD+"/json?poll=1&since=latest",{cache:"no-store",referrerPolicy:"no-referrer"}).then(function(r){if(!r.ok)throw 0;return r.text()})
 }).then(function(t){
  var last=null;t.split("\n").forEach(function(l){if(!l.trim())return;try{var ev=JSON.parse(l);if(ev.event==="message")last=ev}catch(e){}});
  if(!last)return;
  var p=last.attachment&&last.attachment.url?fetch(last.attachment.url,{cache:"no-store",referrerPolicy:"no-referrer"}).then(function(r){if(!r.ok)throw 0;return r.text()}):Promise.resolve(last.message||"");
  return p.then(function(raw){var w=JSON.parse(raw);if(!w||w.v!==2)return;return open_(w).then(function(d){place(eqOf(d))})})
 }).catch(function(){})
}
draw();
boot();
})();
</script>
