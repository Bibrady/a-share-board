<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>复利计算</title>
<link rel="icon" href="/a-share-board/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/a-share-board/favicon-32.png"><link rel="apple-touch-icon" href="/a-share-board/apple-touch-icon.png"><link rel="manifest" href="/a-share-board/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="A股看板"><meta name="application-name" content="A股看板"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4f5f7;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.card{background:#fff;border-radius:14px;padding:14px 14px 6px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.row label{flex:0 0 5.6em;font-size:17px;color:#4b5563}
.row .f{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
input{width:100%;min-width:0;font:inherit;font-size:20px;font-weight:600;color:#111;padding:9px 11px;border:1px solid #d6d9df;border-radius:10px;background:#fff;-webkit-appearance:none;appearance:none;outline:none}
input:focus{border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.15)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]{min-height:46px;line-height:1.2}
.u{flex:0 0 auto;color:#6b7280;font-size:17px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.seg button{font:inherit;font-size:16.5px;font-weight:600;padding:10px 0;border:1px solid #d6d9df;border-radius:10px;background:#fff;color:#374151;-webkit-tap-highlight-color:transparent}
.seg button.on{background:#2f6fed;border-color:#2f6fed;color:#fff}
.today{flex:0 0 auto;font:inherit;font-size:15px;padding:10px 10px;border:1px solid #d6d9df;border-radius:10px;background:#fff;color:#2f6fed}
.sum{background:#2f6fed;color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:18px;line-height:1.55}
.sum b{font-size:24px;font-weight:700}
.sum .sub{font-size:14.5px;opacity:.85}
.sum.empty{background:#e9edf5;color:#6b7280}
.tw{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ts{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
th{position:sticky;top:0;background:#f8f9fb;color:#6b7280;font-weight:600;font-size:14.5px;padding:10px 5px;border-bottom:1px solid #e8e8ec;white-space:nowrap;text-align:right}
td{padding:10px 5px;border-bottom:1px solid #f0f1f4;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:center;padding-left:6px;color:#6b7280}
th:nth-child(2),td:nth-child(2){text-align:left}
th:last-child,td:last-child{padding-right:10px}
td .w{display:block;font-size:12.5px;color:#9aa0a6;line-height:1.2}
td.p{color:#d0342c}
td.n{color:#1a9b4b}
td.m{font-weight:600}
tr.z td{color:#9aa0a6;background:#fcfcfd}
tr.x td{background:#fff7e6}
.note{font-size:13.5px;color:#9aa0a6;text-align:center;margin:14px 4px 0}
</style>
</head>
<body>
<style>.stab{background:#fff;border-bottom:1px solid #e8e8ec;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}.stab>div{max-width:1180px;margin:0 auto;display:flex;gap:4px}.stab a{flex:0 1 auto;display:block;padding:0 16px;height:44px;line-height:44px;font-size:15.5px;font-weight:600;color:#6b7280;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent}.stab a.on{color:#2f6fed;border-bottom-color:#2f6fed}@media (max-width:759px){.stab a{flex:1;text-align:center;padding:0 6px}}</style><nav class="stab" aria-label="看板切换"><div><a href="../">10日新高</a><a href="../market/">大盘盘面</a><a href="../compound/" class="on" aria-current="page">复利计算</a></div></nav>
<div class="wrap">
  <div class="card">
    <div class="row"><label for="p0">起始本金</label><div class="f"><input id="p0" type="number" inputmode="decimal" step="any" min="0" placeholder="例如 1000" autocomplete="off"><span class="u">U</span></div></div>
    <div class="row"><label for="r">每期收益率</label><div class="f"><input id="r" type="number" inputmode="decimal" step="any" placeholder="例如 15" autocomplete="off"><span class="u">%</span></div></div>
    <div class="row"><label>频次</label><div class="seg" id="fq">
      <button type="button" data-v="7">每周</button><button type="button" data-v="14">每两周</button><button type="button" data-v="21">每三周</button><button type="button" data-v="m">每月</button>
    </div></div>
    <div class="row"><label for="d0">起始日期</label><div class="f"><input id="d0" type="date"><button type="button" class="today" id="td">今天</button></div></div>
    <div class="row"><label for="n">期数</label><div class="f"><input id="n" type="number" inputmode="numeric" step="1" min="1" max="520" autocomplete="off"><span class="u">期</span></div></div>
  </div>
  <div class="sum empty" id="sum">请输入起始本金和每期收益率</div>
  <div class="tw"><div class="ts"><table>
    <thead><tr><th>期数</th><th>日期</th><th>本期盈利</th><th>期末金额</th><th>倍数</th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div></div>
  <p class="note">仅在本机浏览器计算，输入只保存在本机，不上传任何数据。<br>每月 = 次月同日（无该日则取月末）。</p>
</div>
<script>
(function(){
"use strict";
var KEY="compound_v1", WD=["周日","周一","周二","周三","周四","周五","周六"];
var $=function(id){return document.getElementById(id);};
var p0=$("p0"), r=$("r"), d0=$("d0"), n=$("n"), fq=$("fq"), sum=$("sum"), tb=$("tb");
var freq="14";
function todayBJ(){
  try{ var s=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
       if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; }catch(e){}
  var t=new Date(Date.now()+8*3600e3); return t.toISOString().slice(0,10);
}
function pad(x){return (x<10?"0":"")+x;}
function parseD(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?{y:+m[1],m:+m[2],d:+m[3]}:null;}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}   // m: 1-12
function addPeriod(s,k){   // k-th settlement date after start s (UTC date math, no DST issues)
  var y=s.y, m=s.m, d=s.d, t;
  if(freq==="m"){ var mm=m-1+k; y=s.y+Math.floor(mm/12); m=mm%12+1; d=Math.min(s.d,dim(y,m)); t=Date.UTC(y,m-1,d); }
  else t=Date.UTC(s.y,s.m-1,s.d)+k*(+freq)*864e5;
  var o=new Date(t); return {s:o.getUTCFullYear()+"-"+pad(o.getUTCMonth()+1)+"-"+pad(o.getUTCDate()), w:WD[o.getUTCDay()]};
}
function fm(v){var a=Math.abs(v); return v.toLocaleString("zh-CN",a>=1e4?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2});}
function ft(v){var a=Math.abs(v);   // table cells: compact 万/亿 for big numbers so 5 columns fit an iPhone screen
  if(a>=1e8) return (v/1e8).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})+"亿";
  if(a>=1e6) return (v/1e4).toLocaleString("zh-CN",{maximumFractionDigits:0})+"万";
  if(a>=1e5) return (v/1e4).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})+"万";
  return fm(v);}
function fx(v){return (v>=1000?v.toFixed(0):v>=100?v.toFixed(1):v.toFixed(2))+"x";}
function save(){try{localStorage.setItem(KEY,JSON.stringify({p0:p0.value,r:r.value,f:freq,d0:d0.value,n:n.value}));}catch(e){}}
function load(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  o=o||{}; p0.value=o.p0||""; r.value=(o.r!=null&&o.r!=="")?o.r:""; freq=o.f||"14"; d0.value=o.d0||todayBJ(); n.value=o.n||"12";}
function setSeg(){var b=fq.querySelectorAll("button"); for(var i=0;i<b.length;i++) b[i].className=b[i].getAttribute("data-v")===freq?"on":"";}
function calc(){
  save(); setSeg();
  var P=parseFloat(p0.value), R=parseFloat(r.value), N=parseInt(n.value,10), S=parseD(d0.value)||parseD(todayBJ());
  if(!(P>0)||!isFinite(R)||R<=-100){ sum.className="sum empty"; sum.textContent="请输入起始本金和每期收益率"; tb.innerHTML=""; return; }
  if(!(N>=1)) N=12; if(N>520) N=520;
  var g=1+R/100, v=P, h=[], st=addPeriod(S,0), last=st;
  h.push('<tr class="z"><td>0</td><td>'+st.s.slice(5)+'<span class="w">'+st.s.slice(0,4)+' '+st.w+'</span></td><td>起始</td><td class="m">'+ft(P)+'</td><td>1.00x</td></tr>');
  var nextX=10;   // highlight the row where 10x / 100x ... is first reached
  for(var k=1;k<=N;k++){
    var pr=v*(g-1), nv=v*g, dd=addPeriod(S,k), mul=nv/P, hit=false;
    if(mul>=nextX && R>0){ hit=true; while(mul>=nextX) nextX*=10; }
    h.push('<tr'+(hit?' class="x"':'')+'><td>'+k+'</td><td>'+dd.s.slice(5)+'<span class="w">'+dd.s.slice(0,4)+' '+dd.w+'</span></td><td class="'+(pr>=0?'p':'n')+'">'+(pr>=0?'+':'')+ft(pr)+'</td><td class="m">'+ft(nv)+'</td><td>'+fx(mul)+'</td></tr>');
    v=nv; last=dd;
  }
  tb.innerHTML=h.join("");
  sum.className="sum";
  sum.innerHTML=N+' 期后 <b>'+fm(v)+'</b> U · <b>'+fx(v/P).slice(0,-1)+'</b> 倍<br><span class="sub">达成日期 '+last.s+'（'+last.w+'） · 共 '+
    Math.round((Date.UTC(+last.s.slice(0,4),+last.s.slice(5,7)-1,+last.s.slice(8,10))-Date.UTC(S.y,S.m-1,S.d))/864e5)+' 天</span>';
}
load(); setSeg();
[p0,r,d0,n].forEach(function(e){e.addEventListener("input",calc); e.addEventListener("change",calc);});
fq.addEventListener("click",function(e){var b=e.target.closest("button"); if(!b) return; freq=b.getAttribute("data-v"); calc();});
$("td").addEventListener("click",function(){d0.value=todayBJ(); calc();});
calc();
})();
</script>
</body>
</html>
